name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Recover ChooseHero background callback order
        run: |
          echo '=== callback xrefs ==='
          python tools/ghidra/query_full_index.py xrefs 002ef230 --limit 100 || true
          python tools/ghidra/query_full_index.py xrefs 002ee720 --limit 100 || true
          python tools/ghidra/query_full_index.py xrefs 002eea00 --limit 100 || true
          python tools/ghidra/query_full_index.py xrefs 002ee7f4 --limit 100 || true
          python tools/ghidra/query_full_index.py xrefs 002edb38 --limit 100 || true
          python tools/ghidra/query_full_index.py xrefs 002edc20 --limit 100 || true
          python tools/ghidra/query_full_index.py xrefs 002edcf0 --limit 100 || true
          echo '=== createUI range refs ==='
          python - <<'PY'
          import csv,gzip
          from pathlib import Path
          root=Path('docs/ghidra/full-index')
          def rows(name):
              with gzip.open(root/name,'rt',encoding='utf-8',newline='') as f: yield from csv.DictReader(f,delimiter='\t')
          def hx(v):
              try:return int(v,16)
              except:return None
          names={}
          for r in rows('libcocos2dcpp.functions.tsv.gz'):
              e=hx(r.get('entry',''))
              if e is not None: names[e]=r.get('name','')
          start,end=0x002eecfc,0x002eedb8
          refs=[]
          for r in rows('libcocos2dcpp.xrefs.tsv.gz'):
              frm=hx(r.get('from','')); to=hx(r.get('to',''))
              if frm is not None and to is not None and start<=frm<end and to in names:
                  refs.append((frm,to,r.get('type',''),names[to]))
          for row in sorted(refs): print('%08x\t%08x\t%s\t%s'%row)
          PY
