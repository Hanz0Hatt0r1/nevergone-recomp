name: GameScene construction plan

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_scene_construction_plan.cpp'
      - 'android/app/src/main/cpp/game_scene_construction_plan.h'
      - 'android/app/src/main/cpp/game_scene_construction_diagnostics.h'
      - 'android/app/src/main/cpp/game_scene_player_entry_markers.cpp'
      - 'android/app/src/main/cpp/game_scene_player_entry_markers.h'
      - 'android/app/src/main/cpp/game_scene_type0_resource.h'
      - 'android/app/src/main/cpp/game_levels_scene_instance.h'
      - 'android/app/src/main/cpp/game_levels_scene_prefix.h'
      - 'android/app/src/main/cpp/game_levels_layer_tail.h'
      - 'android/app/src/main/cpp/game_levels_runtime_state.cpp'
      - 'android/app/src/main/cpp/game_levels_runtime_state.h'
      - 'tools/game_scene_construction_plan_smoke.cpp'
      - 'tools/game_scene_construction_diagnostics_smoke.cpp'
      - 'tools/game_scene_player_entry_markers_smoke.cpp'
      - '.github/workflows/game-scene-construction-plan.yml'
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_scene_construction_plan.cpp'
      - 'android/app/src/main/cpp/game_scene_construction_plan.h'
      - 'android/app/src/main/cpp/game_scene_construction_diagnostics.h'
      - 'android/app/src/main/cpp/game_scene_player_entry_markers.cpp'
      - 'android/app/src/main/cpp/game_scene_player_entry_markers.h'
      - 'android/app/src/main/cpp/game_scene_type0_resource.h'
      - 'android/app/src/main/cpp/game_levels_scene_instance.h'
      - 'android/app/src/main/cpp/game_levels_scene_prefix.h'
      - 'android/app/src/main/cpp/game_levels_layer_tail.h'
      - 'android/app/src/main/cpp/game_levels_runtime_state.cpp'
      - 'android/app/src/main/cpp/game_levels_runtime_state.h'
      - 'tools/game_scene_construction_plan_smoke.cpp'
      - 'tools/game_scene_construction_diagnostics_smoke.cpp'
      - 'tools/game_scene_player_entry_markers_smoke.cpp'
      - '.github/workflows/game-scene-construction-plan.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run construction-plan smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_scene_construction_plan_smoke.cpp \
            android/app/src/main/cpp/game_scene_construction_plan.cpp \
            -o /tmp/game_scene_construction_plan_smoke
          /tmp/game_scene_construction_plan_smoke
      - name: Build and run unresolved-type diagnostics smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_scene_construction_diagnostics_smoke.cpp \
            android/app/src/main/cpp/game_scene_construction_plan.cpp \
            -o /tmp/game_scene_construction_diagnostics_smoke
          /tmp/game_scene_construction_diagnostics_smoke
      - name: Build and run player-entry marker smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_scene_player_entry_markers_smoke.cpp \
            android/app/src/main/cpp/game_scene_player_entry_markers.cpp \
            -o /tmp/game_scene_player_entry_markers_smoke
          /tmp/game_scene_player_entry_markers_smoke
