name: SceneActions primary frame plan

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/scene_actions_base_sprite_update.h'
      - 'android/app/src/main/cpp/scene_actions_flip_x_geometry.h'
      - 'android/app/src/main/cpp/scene_actions_primary_frame_plan.h'
      - 'android/app/src/main/cpp/trap_actions_document.h'
      - 'tools/scene_actions_primary_frame_plan_smoke.cpp'
      - '.github/workflows/scene-actions-primary-frame-plan.yml'
  push:
    branches: [ main ]
    paths:
      - 'android/app/src/main/cpp/scene_actions_base_sprite_update.h'
      - 'android/app/src/main/cpp/scene_actions_flip_x_geometry.h'
      - 'android/app/src/main/cpp/scene_actions_primary_frame_plan.h'
      - 'android/app/src/main/cpp/trap_actions_document.h'
      - 'tools/scene_actions_primary_frame_plan_smoke.cpp'
      - '.github/workflows/scene-actions-primary-frame-plan.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SceneActions primary frame plan smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/scene_actions_primary_frame_plan_smoke.cpp \
            -o /tmp/scene_actions_primary_frame_plan_smoke
          /tmp/scene_actions_primary_frame_plan_smoke
