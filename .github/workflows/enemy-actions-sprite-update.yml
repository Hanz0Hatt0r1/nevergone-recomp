name: EnemyActions sprite update composition

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile composed sprite update smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/enemy_actions_sprite_update_smoke.cpp \
            -o /tmp/enemy_actions_sprite_update_smoke

      - name: Run composed sprite update smoke
        run: /tmp/enemy_actions_sprite_update_smoke
