name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Run TapToStart reconstruction queries
        run: |
          python tools/ghidra/query_full_index.py functions TapToStart --limit 50 || true
          python tools/ghidra/query_full_index.py callers 003063c2 --limit 50 || true
          python tools/ghidra/query_full_index.py callees 003063c2 --limit 50 || true
          python tools/ghidra/query_full_index.py callers 0030c400 --limit 50 || true
          python tools/ghidra/query_full_index.py callees 0030c400 --limit 50 || true
          python tools/ghidra/query_full_index.py callees 0030c440 --limit 50 || true
          python tools/ghidra/query_full_index.py callers 0030c454 --limit 50 || true
          python tools/ghidra/query_full_index.py callees 0030c454 --limit 50 || true
          python tools/ghidra/query_full_index.py callees 0030ca18 --limit 200 || true
          python tools/ghidra/query_full_index.py callees 002a0b0c --limit 100 || true
          python tools/ghidra/query_full_index.py callers 00306ca6 --limit 100 || true
          python tools/ghidra/query_full_index.py callees 00306ca6 --limit 100 || true
          echo '=== DIRECT STRINGS REFERENCED FROM TARGET BODIES ==='
          python - <<'PY'
          import base64, csv, gzip
          from pathlib import Path
          root = Path('docs/ghidra/full-index')
          def rows(name):
              with gzip.open(root / name, 'rt', encoding='utf-8', newline='') as f:
                  yield from csv.DictReader(f, delimiter='\t')
          def h(value):
              try: return int(value, 16)
              except Exception: return None
          entries=[]
          for r in rows('libcocos2dcpp.functions.tsv.gz'):
              e=h(r.get('entry',''))
              if e is not None: entries.append(e)
          entries.sort()
          strings={}
          for r in rows('libcocos2dcpp.strings.tsv.gz'):
              a=h(r.get('address',''))
              if a is None: continue
              try: strings[a]=base64.b64decode(r['utf8_base64']).decode('utf-8','replace')
              except Exception: pass
          xrefs=list(rows('libcocos2dcpp.xrefs.tsv.gz'))
          targets={
              0x003063c2:'ManagementLayer::GoToTapToStart',
              0x003063ec:'ManagementLayer::initLoginLayer',
              0x0030c400:'TapToStart::OnTapScreen',
              0x0030c440:'TapToStart::ccTouchBegan',
              0x0030c454:'TapToStart::OnLogin',
              0x0030ca18:'TapToStart::init',
              0x002a0b0c:'AndroidSdkMgr::platformAutoLogin',
              0x00306ca6:'ManagementLayer::androidSdkCallBack',
          }
          for start,name in targets.items():
              nxt=min((e for e in entries if e>start), default=start+0x2000)
              print(f'--- {name} [{start:08x},{nxt:08x}) ---')
              seen=set()
              for xr in xrefs:
                  frm=h(xr.get('from','')); to=h(xr.get('to',''))
                  if frm is None or to is None or not(start<=frm<nxt) or to not in strings: continue
                  item=(frm,to,strings[to],xr.get('type',''))
                  if item in seen: continue
                  seen.add(item)
                  print(f'{frm:08x} -> {to:08x} [{item[3]}] {item[2]}')
          PY
