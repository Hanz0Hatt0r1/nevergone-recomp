name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;28.2.13676358'

      - name: Validate Python tools
        run: python3 -m compileall -q tools

      - name: Validate SingleLogin light timeline
        shell: bash
        run: |
          g++ -std=c++17 -O2 \
            -I android/app/src/main/cpp \
            tools/single_login_light_timeline_smoke.cpp \
            android/app/src/main/cpp/single_login_light_timeline.cpp \
            -o /tmp/single_login_light_timeline_smoke
          /tmp/single_login_light_timeline_smoke

      - name: Validate SingleLogin cloud timeline
        shell: bash
        run: |
          g++ -std=c++17 -O2 \
            -I android/app/src/main/cpp \
            tools/single_login_cloud_timeline_smoke.cpp \
            android/app/src/main/cpp/single_login_cloud_timeline.cpp \
            -o /tmp/single_login_cloud_timeline_smoke
          /tmp/single_login_cloud_timeline_smoke

      - name: Validate splash sequence-local timing
        shell: bash
        run: |
          g++ -std=c++17 -O2 \
            -I android/app/src/main/cpp \
            tools/splash_sequence_state_smoke.cpp \
            android/app/src/main/cpp/splash_sequence_state.cpp \
            android/app/src/main/cpp/splash_timeline.cpp \
            -o /tmp/splash_sequence_state_smoke
          /tmp/splash_sequence_state_smoke

      - name: Prepare verified Lua 5.2.3
        run: python3 tools/fetch_lua_5_2_3.py

      - name: Validate embedded Lua compatibility layer
        shell: bash
        run: |
          make -C third_party/_local/lua-5.2.3 generic
          python3 tools/run_lua_compat_smoke.py third_party/_local/lua-5.2.3/src/lua

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Validate 16 KiB page compatibility
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 tools/check_android_16k_alignment.py "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Archive debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nevergone-recomp-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
