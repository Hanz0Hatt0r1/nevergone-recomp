plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nevergone.recomp'
    compileSdk 36

    defaultConfig {
        applicationId 'org.nevergone.recomp'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '0.0.1-dev'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Wpedantic'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
