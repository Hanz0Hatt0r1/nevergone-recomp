name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Probe HPRange symbols and call sites
        run: |
          echo '=== functions containing HPRange ==='
          python tools/ghidra/query_full_index.py functions HPRange --limit 100 || true
          echo '=== symbols containing HPRange ==='
          python tools/ghidra/query_full_index.py symbols HPRange --limit 250 || true
          echo '=== symbols around HPData typed readers ==='
          python tools/ghidra/query_full_index.py symbols 002d6568 --limit 20 || true
          python tools/ghidra/query_full_index.py symbols 002d658a --limit 20 || true
          python tools/ghidra/query_full_index.py symbols 002d65ac --limit 20 || true
          python tools/ghidra/query_full_index.py symbols 002d65ce --limit 20 || true
          python tools/ghidra/query_full_index.py symbols 002d65f0 --limit 20 || true
          echo '=== raw HPRange symbol rows and likely constructors ==='
          python - <<'PY'
          import csv,gzip
          from pathlib import Path
          root=Path('docs/ghidra/full-index')
          with gzip.open(root/'libcocos2dcpp.symbols.tsv.gz','rt',encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f,delimiter='\t'))
          for r in rows:
              text='\t'.join(r.values())
              if 'hprange' in text.casefold():
                  print(text)
          PY
