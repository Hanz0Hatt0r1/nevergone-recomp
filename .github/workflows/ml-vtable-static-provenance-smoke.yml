name: Nevergone ML vtable static provenance smoke

on:
  pull_request:
    paths:
      - 'tools/ml/analyze_nevergone_vtable_static_provenance.py'
      - 'tools/ml/nevergone_vtable_static_provenance_smoke.py'
      - '.github/workflows/ml-vtable-static-provenance-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bounded vtable provenance analysis
        run: python3 tools/ml/nevergone_vtable_static_provenance_smoke.py
