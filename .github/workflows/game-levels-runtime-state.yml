name: GameLevels runtime state

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_levels_runtime_state.cpp'
      - 'android/app/src/main/cpp/game_levels_runtime_state.h'
      - 'android/app/src/main/cpp/game_levels_model.cpp'
      - 'android/app/src/main/cpp/game_levels_global_section.cpp'
      - 'android/app/src/main/cpp/game_levels_global_section.h'
      - 'android/app/src/main/cpp/game_levels_scene_instance.cpp'
      - 'android/app/src/main/cpp/game_levels_scene_instance.h'
      - 'android/app/src/main/cpp/game_levels_scene_navigation.cpp'
      - 'android/app/src/main/cpp/game_levels_port_navigation.cpp'
      - 'android/app/src/main/cpp/game_scene_construction_plan.cpp'
      - 'android/app/src/main/cpp/game_scene_construction_plan.h'
      - 'android/app/src/main/cpp/game_scene_type0_resource.h'
      - 'android/app/src/main/cpp/game_scene_render_queue.h'
      - 'android/app/src/main/cpp/game_scene_sprite_frame_plist_requests.h'
      - 'tools/game_levels_runtime_state_smoke.cpp'
      - '.github/workflows/game-levels-runtime-state.yml'
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_levels_runtime_state.cpp'
      - 'android/app/src/main/cpp/game_levels_runtime_state.h'
      - 'android/app/src/main/cpp/game_levels_model.cpp'
      - 'android/app/src/main/cpp/game_levels_global_section.cpp'
      - 'android/app/src/main/cpp/game_levels_global_section.h'
      - 'android/app/src/main/cpp/game_levels_scene_instance.cpp'
      - 'android/app/src/main/cpp/game_levels_scene_instance.h'
      - 'android/app/src/main/cpp/game_levels_scene_navigation.cpp'
      - 'android/app/src/main/cpp/game_levels_port_navigation.cpp'
      - 'android/app/src/main/cpp/game_scene_construction_plan.cpp'
      - 'android/app/src/main/cpp/game_scene_construction_plan.h'
      - 'android/app/src/main/cpp/game_scene_type0_resource.h'
      - 'android/app/src/main/cpp/game_scene_render_queue.h'
      - 'android/app/src/main/cpp/game_scene_sprite_frame_plist_requests.h'
      - 'tools/game_levels_runtime_state_smoke.cpp'
      - '.github/workflows/game-levels-runtime-state.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run runtime-state smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_levels_runtime_state_smoke.cpp \
            android/app/src/main/cpp/game_levels_runtime_state.cpp \
            android/app/src/main/cpp/game_levels_model.cpp \
            android/app/src/main/cpp/game_levels_actions_section.cpp \
            android/app/src/main/cpp/game_levels_global_section.cpp \
            android/app/src/main/cpp/game_levels_layer_tail.cpp \
            android/app/src/main/cpp/game_levels_scene_prefix.cpp \
            android/app/src/main/cpp/game_levels_port_node_section.cpp \
            android/app/src/main/cpp/game_levels_port_node_graph.cpp \
            android/app/src/main/cpp/game_levels_port_navigation.cpp \
            android/app/src/main/cpp/game_levels_start_scene.cpp \
            android/app/src/main/cpp/game_levels_scene_navigation.cpp \
            android/app/src/main/cpp/game_levels_scene_instance.cpp \
            android/app/src/main/cpp/game_scene_construction_plan.cpp \
            android/app/src/main/cpp/hp_data_reader.cpp \
            -o /tmp/game_levels_runtime_state_smoke
          /tmp/game_levels_runtime_state_smoke
