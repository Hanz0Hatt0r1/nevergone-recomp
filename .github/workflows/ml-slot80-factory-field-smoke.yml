name: ML slot80 factory field candidate smoke

on:
  pull_request:
    paths:
      - 'tools/ml/audit_nevergone_slot80_factory_fields.py'
      - 'tools/ml/nevergone_slot80_factory_fields_smoke.py'
      - '.github/workflows/ml-slot80-factory-field-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/audit_nevergone_slot80_factory_fields.py'
      - 'tools/ml/nevergone_slot80_factory_fields_smoke.py'
      - '.github/workflows/ml-slot80-factory-field-smoke.yml'

jobs:
  evidence-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test fail-closed exact-APK field audit helpers
        run: |
          python3 tools/ml/nevergone_slot80_factory_fields_smoke.py
          python3 -m py_compile tools/ml/audit_nevergone_slot80_factory_fields.py
