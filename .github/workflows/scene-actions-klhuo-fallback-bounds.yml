name: SceneActions klhuo fallback bounds

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build klhuo fallback-bounds smoke
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iandroid/app/src/main/cpp
          tools/scene_actions_klhuo_fallback_bounds_smoke.cpp
          -o /tmp/scene_actions_klhuo_fallback_bounds_smoke
      - name: Run klhuo fallback-bounds smoke
        run: /tmp/scene_actions_klhuo_fallback_bounds_smoke
