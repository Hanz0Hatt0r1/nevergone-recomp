name: Nevergone conditional fusion candidate smoke

on:
  pull_request:
    paths:
      - 'tools/ml/build_nevergone_conditional_fusion_candidate.py'
      - 'tools/ml/export_nevergone_similarity_transfer_oof.py'
      - 'tools/ml/nevergone_conditional_fusion_candidate_smoke.py'
      - 'tools/ml/run_nevergone_conditional_fusion_candidate.sh'
      - '.github/workflows/ml-conditional-fusion-candidate-smoke.yml'
      - 'docs/ml/CONDITIONAL_FUSION_CANDIDATE.md'
  push:
    branches: [main]
    paths:
      - 'tools/ml/build_nevergone_conditional_fusion_candidate.py'
      - 'tools/ml/export_nevergone_similarity_transfer_oof.py'
      - 'tools/ml/nevergone_conditional_fusion_candidate_smoke.py'
      - 'tools/ml/run_nevergone_conditional_fusion_candidate.sh'
      - '.github/workflows/ml-conditional-fusion-candidate-smoke.yml'
      - 'docs/ml/CONDITIONAL_FUSION_CANDIDATE.md'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed candidate smoke
        run: python3 tools/ml/nevergone_conditional_fusion_candidate_smoke.py
      - name: Compile candidate tools
        run: |
          python3 -m py_compile \
            tools/ml/build_nevergone_conditional_fusion_candidate.py \
            tools/ml/export_nevergone_similarity_transfer_oof.py
      - name: Check runner syntax
        run: bash -n tools/ml/run_nevergone_conditional_fusion_candidate.sh
