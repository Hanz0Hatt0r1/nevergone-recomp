name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Query choose-role pane metadata
        run: |
          echo '=== functions ==='
          python tools/ghidra/query_full_index.py functions showChooseHeroPane --limit 20 || true
          python tools/ghidra/query_full_index.py functions GoToChooseRole --limit 20 || true
          echo '=== showChooseHeroPane call graph ==='
          python tools/ghidra/query_full_index.py callers 003e6a20 --limit 100 || true
          python tools/ghidra/query_full_index.py callees 003e6a20 --limit 250 || true
          echo '=== direct strings in showChooseHeroPane ==='
          python - <<'PY'
          import base64, csv, gzip
          from pathlib import Path
          root=Path('docs/ghidra/full-index')
          def rows(name):
              with gzip.open(root/name,'rt',encoding='utf-8',newline='') as f:
                  yield from csv.DictReader(f,delimiter='\t')
          def hx(v):
              try:return int(v,16)
              except:return None
          entries=[]
          for r in rows('libcocos2dcpp.functions.tsv.gz'):
              e=hx(r.get('entry',''))
              if e is not None: entries.append(e)
          entries.sort()
          strings={}
          for r in rows('libcocos2dcpp.strings.tsv.gz'):
              a=hx(r.get('address',''))
              if a is None: continue
              try: strings[a]=base64.b64decode(r['utf8_base64']).decode('utf-8','replace')
              except: pass
          start=0x003e6a20
          end=min((e for e in entries if e>start),default=start+0x1000)
          print(f'function range {start:08x}-{end:08x}')
          for xr in rows('libcocos2dcpp.xrefs.tsv.gz'):
              frm=hx(xr.get('from','')); to=hx(xr.get('to',''))
              if frm is not None and start<=frm<end and to in strings:
                  print(f'{frm:08x}\t{to:08x}\t{xr.get("type","")}\t{strings[to]}')
          PY
          echo '=== choose-related strings ==='
          python tools/ghidra/query_full_index.py strings Choose --limit 100 || true
          python tools/ghidra/query_full_index.py strings Hero --limit 100 || true
