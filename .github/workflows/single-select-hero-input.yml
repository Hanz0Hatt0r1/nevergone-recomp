name: SingleSelectHero rune input

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: single-select-hero-input-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate career rune touch dispatch
        shell: bash
        run: |
          set -euo pipefail
          CXXFLAGS='-std=c++17 -O2 -I android/app/src/main/cpp'
          g++ $CXXFLAGS tools/single_select_hero_input_smoke.cpp \
            android/app/src/main/cpp/single_select_hero_input.cpp \
            android/app/src/main/cpp/single_select_hero_state.cpp \
            android/app/src/main/cpp/single_select_hero_transition_timeline.cpp \
            android/app/src/main/cpp/game_clock.cpp \
            android/app/src/main/cpp/character_name_state.cpp \
            android/app/src/main/cpp/role_creation_validation.cpp \
            android/app/src/main/cpp/role_selection_state.cpp \
            android/app/src/main/cpp/string_validation.cpp \
            android/app/src/main/cpp/startup_contract.cpp \
            -o /tmp/single_select_hero_input_smoke
          /tmp/single_select_hero_input_smoke
