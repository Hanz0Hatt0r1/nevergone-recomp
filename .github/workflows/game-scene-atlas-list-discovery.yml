name: GameScene atlas-list discovery

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/java/org/nevergone/recomp/GameSceneAtlasListDiscovery.java'
      - 'tools/GameSceneAtlasListDiscoverySmoke.java'
      - '.github/workflows/game-scene-atlas-list-discovery.yml'
  pull_request:
    paths:
      - 'android/app/src/main/java/org/nevergone/recomp/GameSceneAtlasListDiscovery.java'
      - 'tools/GameSceneAtlasListDiscoverySmoke.java'
      - '.github/workflows/game-scene-atlas-list-discovery.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run atlas-list discovery smoke
        run: |
          rm -rf /tmp/nevergone-atlas-list-classes
          mkdir -p /tmp/nevergone-atlas-list-classes
          javac -Xlint:all -Werror \
            -d /tmp/nevergone-atlas-list-classes \
            android/app/src/main/java/org/nevergone/recomp/GameSceneAtlasListDiscovery.java \
            tools/GameSceneAtlasListDiscoverySmoke.java
          java -ea -cp /tmp/nevergone-atlas-list-classes \
            org.nevergone.recomp.GameSceneAtlasListDiscoverySmoke
