name: SceneActions active playback

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/scene_actions_active_playback.h'
      - 'android/app/src/main/cpp/scene_actions_play_state.h'
      - 'android/app/src/main/cpp/scene_actions_wa_update.h'
      - 'tools/scene_actions_active_playback_smoke.cpp'
      - '.github/workflows/scene-actions-active-playback.yml'
  push:
    paths:
      - 'android/app/src/main/cpp/scene_actions_active_playback.h'
      - 'android/app/src/main/cpp/scene_actions_play_state.h'
      - 'android/app/src/main/cpp/scene_actions_wa_update.h'
      - 'tools/scene_actions_active_playback_smoke.cpp'
      - '.github/workflows/scene-actions-active-playback.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SceneActions active-playback smoke
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/scene_actions_active_playback_smoke.cpp \
            -o /tmp/scene_actions_active_playback_smoke
          /tmp/scene_actions_active_playback_smoke
