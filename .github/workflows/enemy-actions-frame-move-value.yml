name: EnemyActions frame move value

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile frame move-value smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/enemy_actions_frame_move_value_smoke.cpp \
            -o /tmp/enemy_actions_frame_move_value_smoke

      - name: Run frame move-value smoke
        run: /tmp/enemy_actions_frame_move_value_smoke
