name: Tutorial attack wave runtime

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/tutorial_attack_wave_runtime.*'
      - 'android/app/src/main/cpp/tutorial_enemy_roster.*'
      - 'android/app/src/main/cpp/enemy_health_state.*'
      - 'android/app/src/main/cpp/enemy_online_state_contract.*'
      - 'android/app/src/main/cpp/enemy_physical_state.*'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/tutorial_attack_wave_runtime_smoke.cpp'
      - '.github/workflows/tutorial-attack-wave-runtime.yml'
      - 'docs/tutorial-attack-wave-runtime.md'
  push:
    branches-ignore: [main]
    paths:
      - 'android/app/src/main/cpp/tutorial_attack_wave_runtime.*'
      - 'android/app/src/main/cpp/tutorial_enemy_roster.*'
      - 'android/app/src/main/cpp/enemy_health_state.*'
      - 'android/app/src/main/cpp/enemy_online_state_contract.*'
      - 'android/app/src/main/cpp/enemy_physical_state.*'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/tutorial_attack_wave_runtime_smoke.cpp'
      - '.github/workflows/tutorial-attack-wave-runtime.yml'
      - 'docs/tutorial-attack-wave-runtime.md'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run first Attack-wave orchestration smoke
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I android/app/src/main/cpp \
            tools/tutorial_attack_wave_runtime_smoke.cpp \
            android/app/src/main/cpp/tutorial_attack_wave_runtime.cpp \
            android/app/src/main/cpp/tutorial_enemy_roster.cpp \
            android/app/src/main/cpp/tutorial_enemy_spawn_plan.cpp \
            android/app/src/main/cpp/enemy_health_state.cpp \
            android/app/src/main/cpp/enemy_online_state_contract.cpp \
            android/app/src/main/cpp/enemy_physical_state.cpp \
            -o /tmp/tutorial_attack_wave_runtime_smoke
          /tmp/tutorial_attack_wave_runtime_smoke
