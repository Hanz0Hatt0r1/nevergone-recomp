name: Android emulator smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2,5'
  pull_request:
    paths:
      - '.github/workflows/android-emulator-smoke.yml'

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    name: API ${{ matrix.api-level }} lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;28.2.13676358'

      - name: Prepare verified Lua 5.2.3
        run: python3 tools/fetch_lua_5_2_3.py

      - name: Build emulator-only x86_64 debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: gradle --no-daemon --stacktrace -PciEmulator assembleDebug

      - name: Launch, pause/resume, recreate and cold-restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail

            PACKAGE='org.nevergone.recomp'
            COMPONENT='org.nevergone.recomp/.MainActivity'
            APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
            test -n "$APK"

            fatal_check() {
              local phase="$1"
              if adb logcat -d | grep -E 'FATAL EXCEPTION|Fatal signal.*org\.nevergone\.recomp'; then
                echo "Never Gone Recomp crashed during ${phase}" >&2
                exit 1
              fi
            }

            require_pid() {
              local phase="$1"
              local pid
              pid="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
              if [ -z "$pid" ]; then
                echo "Never Gone Recomp has no live process during ${phase}" >&2
                exit 1
              fi
              printf '%s' "$pid"
            }

            require_foreground() {
              local phase="$1"
              if ! adb shell dumpsys activity activities | grep -Eq \
                  'mResumedActivity.*org\.nevergone\.recomp|topResumedActivity=.*org\.nevergone\.recomp'; then
                echo "Never Gone Recomp is not resumed during ${phase}" >&2
                adb shell dumpsys activity activities >&2
                exit 1
              fi
            }

            adb install -r "$APK"
            adb logcat -c

            # Initial foreground launch.
            adb shell am start -W -n "$COMPONENT"
            sleep 5
            INITIAL_PID="$(require_pid 'initial launch')"
            require_foreground 'initial launch'
            fatal_check 'initial launch'

            # Home pauses the Activity while keeping the process alive. The same
            # PID requirement makes this a real pause/resume path rather than a
            # silent process restart.
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            PAUSED_PID="$(require_pid 'home pause')"
            test "$PAUSED_PID" = "$INITIAL_PID"
            fatal_check 'home pause'

            adb shell am start -W -n "$COMPONENT"
            sleep 3
            RESUMED_PID="$(require_pid 'resume')"
            test "$RESUMED_PID" = "$INITIAL_PID"
            require_foreground 'resume'
            fatal_check 'resume'

            # Finish the Activity with Back, then start it again immediately.
            # Android normally retains the process; requiring the same PID means
            # a new Activity/GLSurfaceView and EGL surface are created inside the
            # existing native process, exercising stale-GL-handle reset paths.
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            RECREATE_PID="$(require_pid 'activity finish')"
            test "$RECREATE_PID" = "$INITIAL_PID"
            adb shell am start -W -n "$COMPONENT"
            sleep 3
            RECREATED_PID="$(require_pid 'activity recreation')"
            test "$RECREATED_PID" = "$INITIAL_PID"
            require_foreground 'activity recreation'
            fatal_check 'activity recreation'

            # Cold restart covers complete process/native-runtime initialization
            # after the lifecycle/surface path above.
            adb shell am force-stop "$PACKAGE"
            sleep 1
            if adb shell pidof "$PACKAGE" | grep -q '[0-9]'; then
              echo 'Never Gone Recomp process survived force-stop' >&2
              exit 1
            fi
            adb shell am start -W -n "$COMPONENT"
            sleep 3
            require_pid 'cold restart' >/dev/null
            require_foreground 'cold restart'
            fatal_check 'cold restart'

            adb shell am force-stop "$PACKAGE"
