name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Query ChooseHeroReadyUIScene metadata
        run: |
          echo '=== functions ==='
          python tools/ghidra/query_full_index.py functions ChooseHeroReadyUIScene --limit 100 || true
          echo '=== choose hero strings ==='
          python tools/ghidra/query_full_index.py strings ChooseHero --limit 100 || true
          echo '=== gate strings ==='
          python tools/ghidra/query_full_index.py strings Gate_ --limit 100 || true
