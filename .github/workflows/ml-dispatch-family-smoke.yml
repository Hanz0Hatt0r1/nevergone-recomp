name: Nevergone ML dispatch family smoke

on:
  push:
    paths:
      - 'tools/ml/analyze_nevergone_dispatch_families.py'
      - 'tools/ml/nevergone_dispatch_family_smoke.py'
      - '.github/workflows/ml-dispatch-family-smoke.yml'
  pull_request:
    paths:
      - 'tools/ml/analyze_nevergone_dispatch_families.py'
      - 'tools/ml/nevergone_dispatch_family_smoke.py'
      - '.github/workflows/ml-dispatch-family-smoke.yml'

permissions:
  contents: read

jobs:
  dispatch-family-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tools
        run: |
          python -m py_compile \
            tools/ml/analyze_nevergone_dispatch_families.py \
            tools/ml/nevergone_dispatch_family_smoke.py
      - name: Run smoke
        run: python tools/ml/nevergone_dispatch_family_smoke.py
