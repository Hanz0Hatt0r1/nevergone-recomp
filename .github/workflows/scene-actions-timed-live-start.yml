name: SceneActions timed live start

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build timed SceneActions live-start smoke
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iandroid/app/src/main/cpp
          tools/scene_actions_timed_live_start_smoke.cpp
          -o /tmp/scene_actions_timed_live_start_smoke
      - name: Run timed SceneActions live-start smoke
        run: /tmp/scene_actions_timed_live_start_smoke
