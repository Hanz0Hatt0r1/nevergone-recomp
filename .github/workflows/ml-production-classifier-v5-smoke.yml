name: Nevergone Production Classifier v5 smoke

on:
  pull_request:
    paths:
      - 'tools/ml/build_nevergone_v5_evidence.py'
      - 'tools/ml/train_nevergone_production_classifier_v5.py'
      - 'tools/ml/classify_nevergone_pcode.py'
      - 'tools/ml/nevergone_production_classifier_v5_smoke.py'
      - 'tools/ml/run_nevergone_production_classifier_v5.sh'
      - 'docs/ml/PRODUCTION_CLASSIFIER_V5.md'
      - '.github/workflows/ml-production-classifier-v5-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/build_nevergone_v5_evidence.py'
      - 'tools/ml/train_nevergone_production_classifier_v5.py'
      - 'tools/ml/classify_nevergone_pcode.py'
      - 'tools/ml/nevergone_production_classifier_v5_smoke.py'
      - 'tools/ml/run_nevergone_production_classifier_v5.sh'
      - 'docs/ml/PRODUCTION_CLASSIFIER_V5.md'
      - '.github/workflows/ml-production-classifier-v5-smoke.yml'

jobs:
  production-classifier-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install -U numpy scikit-learn joblib
      - name: Validate v5 pipeline
        run: |
          python -m py_compile \
            tools/ml/build_nevergone_v5_evidence.py \
            tools/ml/train_nevergone_production_classifier_v5.py \
            tools/ml/classify_nevergone_pcode.py \
            tools/ml/nevergone_production_classifier_v5_smoke.py
          PYTHONPATH=tools/ml python tools/ml/nevergone_production_classifier_v5_smoke.py
          bash -n tools/ml/run_nevergone_production_classifier_v5.sh
