name: Player action runtime loading

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/player_action_document_store.cpp'
      - 'android/app/src/main/cpp/player_action_document_store.h'
      - 'android/app/src/main/cpp/player_action_runtime_bridge.cpp'
      - 'android/app/src/main/cpp/game_scene_player_bootstrap.cpp'
      - 'android/app/src/main/cpp/game_scene_player_bootstrap.h'
      - 'android/app/src/main/cpp/game_scene_player_entry_markers.cpp'
      - 'android/app/src/main/cpp/game_scene_player_entry_markers.h'
      - 'android/app/src/main/cpp/game_scene_player_spawn_state.cpp'
      - 'android/app/src/main/cpp/game_scene_player_spawn_state.h'
      - 'android/app/src/main/cpp/game_scene_direct_geometry.h'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'android/app/src/main/java/org/nevergone/recomp/PlayerActionAssetResolver.java'
      - 'android/app/src/main/java/org/nevergone/recomp/PlayerActionRuntimeLoader.java'
      - 'android/app/src/main/java/org/nevergone/recomp/GameSceneDirectAssetStager.java'
      - 'tools/player_action_document_store_smoke.cpp'
      - 'tools/game_scene_player_spawn_state_smoke.cpp'
      - 'tools/PlayerActionAssetResolverSmoke.java'
      - 'docs/player-action-runtime-loading.md'
      - 'docs/player-spawn-runtime-state.md'
      - '.github/workflows/player-action-runtime-load.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/player_action_document_store.cpp'
      - 'android/app/src/main/cpp/player_action_document_store.h'
      - 'android/app/src/main/cpp/player_action_runtime_bridge.cpp'
      - 'android/app/src/main/cpp/game_scene_player_bootstrap.cpp'
      - 'android/app/src/main/cpp/game_scene_player_bootstrap.h'
      - 'android/app/src/main/cpp/game_scene_player_entry_markers.cpp'
      - 'android/app/src/main/cpp/game_scene_player_entry_markers.h'
      - 'android/app/src/main/cpp/game_scene_player_spawn_state.cpp'
      - 'android/app/src/main/cpp/game_scene_player_spawn_state.h'
      - 'android/app/src/main/cpp/game_scene_direct_geometry.h'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'android/app/src/main/java/org/nevergone/recomp/PlayerActionAssetResolver.java'
      - 'android/app/src/main/java/org/nevergone/recomp/PlayerActionRuntimeLoader.java'
      - 'android/app/src/main/java/org/nevergone/recomp/GameSceneDirectAssetStager.java'
      - 'tools/player_action_document_store_smoke.cpp'
      - 'tools/game_scene_player_spawn_state_smoke.cpp'
      - 'tools/PlayerActionAssetResolverSmoke.java'
      - 'docs/player-action-runtime-loading.md'
      - 'docs/player-spawn-runtime-state.md'
      - '.github/workflows/player-action-runtime-load.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build and run native player action document store smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/hp_data_reader.cpp \
            android/app/src/main/cpp/enemy_actions_layout_evidence.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_prefix.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_combo_section.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_final_table.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_document.cpp \
            android/app/src/main/cpp/player_action_document_store.cpp \
            tools/player_action_document_store_smoke.cpp \
            -o /tmp/player_action_document_store_smoke
          /tmp/player_action_document_store_smoke

      - name: Build and run player spawn state smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/game_scene_player_bootstrap.cpp \
            android/app/src/main/cpp/game_scene_player_entry_markers.cpp \
            android/app/src/main/cpp/game_scene_player_spawn_state.cpp \
            tools/game_scene_player_spawn_state_smoke.cpp \
            -o /tmp/game_scene_player_spawn_state_smoke
          /tmp/game_scene_player_spawn_state_smoke

      - name: Build and run imported player action resolver smoke
        run: |
          rm -rf /tmp/player-action-java
          mkdir -p /tmp/player-action-java
          javac -d /tmp/player-action-java \
            android/app/src/main/java/org/nevergone/recomp/PlayerActionAssetResolver.java \
            android/app/src/main/java/org/nevergone/recomp/PlayerActionRuntimeLoader.java \
            tools/PlayerActionAssetResolverSmoke.java
          java -cp /tmp/player-action-java org.nevergone.recomp.PlayerActionAssetResolverSmoke
