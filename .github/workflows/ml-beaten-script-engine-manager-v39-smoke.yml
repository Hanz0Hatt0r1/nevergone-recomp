name: Nevergone BeatenEffect script engine manager v39 smoke

on:
  pull_request:
    paths:
      - 'tools/ml/audit_nevergone_beaten_script_engine_manager_v39.py'
      - 'tools/ml/nevergone_beaten_script_engine_manager_v39_smoke.py'
      - 'tools/ml/nevergone_v39_shared_manager_symbol_resolution_smoke.py'
      - 'tools/ml/run_nevergone_beaten_script_engine_manager_v39.sh'
      - '.github/workflows/ml-beaten-script-engine-manager-v39-smoke.yml'
      - 'docs/evidence/beaten-script-engine-manager-v39.md'
  push:
    branches: [main]
    paths:
      - 'tools/ml/audit_nevergone_beaten_script_engine_manager_v39.py'
      - 'tools/ml/nevergone_beaten_script_engine_manager_v39_smoke.py'
      - 'tools/ml/nevergone_v39_shared_manager_symbol_resolution_smoke.py'
      - 'tools/ml/run_nevergone_beaten_script_engine_manager_v39.sh'
      - '.github/workflows/ml-beaten-script-engine-manager-v39-smoke.yml'
      - 'docs/evidence/beaten-script-engine-manager-v39.md'

jobs:
  beaten-script-engine-manager-v39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate v39 analyzer
        run: |
          python3 -m py_compile \
            tools/ml/audit_nevergone_beaten_script_engine_manager_v39.py \
            tools/ml/nevergone_beaten_script_engine_manager_v39_smoke.py \
            tools/ml/nevergone_v39_shared_manager_symbol_resolution_smoke.py
          PYTHONPATH=tools/ml python3 tools/ml/nevergone_beaten_script_engine_manager_v39_smoke.py
          python3 tools/ml/nevergone_v39_shared_manager_symbol_resolution_smoke.py
          bash -n tools/ml/run_nevergone_beaten_script_engine_manager_v39.sh
          grep -q 'NEVERGONE.GhidraClassParameterFieldWrite/1' tools/ghidra/ExportClassParameterFieldWrites.java
          grep -q 'NEVERGONE.GhidraClassOwnerAliasFlow/1' tools/ghidra/ExportClassOwnerAliasFlow.java
          grep -q 'NEVERGONE.GhidraAccessorReturnConsumers/1' tools/ghidra/ExportAccessorReturnConsumers.java
