name: GameSceneObject event ID mapping

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GameSceneObject event-ID smoke
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iandroid/app/src/main/cpp
          tools/game_scene_object_event_id_smoke.cpp
          -o /tmp/game_scene_object_event_id_smoke
      - name: Run GameSceneObject event-ID smoke
        run: /tmp/game_scene_object_event_id_smoke
