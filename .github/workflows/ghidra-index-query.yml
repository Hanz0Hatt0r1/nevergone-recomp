name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Query SingleSelectHero initial scene evidence
        run: |
          echo '=== Management transition ==='
          python tools/ghidra/query_full_index.py functions initSelectHero --limit 30 || true
          python tools/ghidra/query_full_index.py callees 00306244 --limit 100 || true
          echo '=== SingleSelectHero init/initUI/FuncBegin call graph ==='
          python tools/ghidra/query_full_index.py callees 0043705c --limit 200 || true
          python tools/ghidra/query_full_index.py callees 00438c20 --limit 350 || true
          python tools/ghidra/query_full_index.py callees 00439ac8 --limit 250 || true
          echo '=== exact initial atlas frames ==='
          python tools/ghidra/query_full_index.py atlases xrbeijing.png --limit 10 || true
          python tools/ghidra/query_full_index.py atlases xrshiguan.png --limit 10 || true
          python tools/ghidra/query_full_index.py atlases xrguangai.png --limit 10 || true
          python tools/ghidra/query_full_index.py atlases xrguancaigai.png --limit 10 || true
          python tools/ghidra/query_full_index.py atlases xrtengman --limit 20 || true
          echo '=== direct strings from SingleSelectHero bodies ==='
          python - <<'PY'
          import base64, csv, gzip
          from pathlib import Path
          root=Path('docs/ghidra/full-index')
          def rows(name):
              with gzip.open(root/name,'rt',encoding='utf-8',newline='') as f:
                  yield from csv.DictReader(f,delimiter='\t')
          def hx(v):
              try:return int(v,16)
              except:return None
          funcs=[]
          for r in rows('libcocos2dcpp.functions.tsv.gz'):
              e=hx(r.get('entry',''))
              if e is not None: funcs.append(e)
          funcs.sort()
          strings={}
          for r in rows('libcocos2dcpp.strings.tsv.gz'):
              a=hx(r.get('address',''))
              if a is None: continue
              try: strings[a]=base64.b64decode(r['utf8_base64']).decode('utf-8','replace')
              except: pass
          xrefs=list(rows('libcocos2dcpp.xrefs.tsv.gz'))
          targets={
              0x00306244:'ManagementLayer::initSelectHero',
              0x0043705c:'SingleSelectHero::FuncBegin',
              0x00438c20:'SingleSelectHero::initUI',
              0x00439ac8:'SingleSelectHero::init',
          }
          for start,name in targets.items():
              end=min((e for e in funcs if e>start),default=start+0x4000)
              print(f'--- {name} [{start:08x},{end:08x}) ---')
              seen=set()
              for xr in xrefs:
                  frm=hx(xr.get('from','')); to=hx(xr.get('to',''))
                  if frm is None or to not in strings or not(start<=frm<end): continue
                  item=(frm,to,strings[to],xr.get('type',''))
                  if item in seen: continue
                  seen.add(item)
                  print(f'{frm:08x} -> {to:08x} [{item[3]}] {item[2]}')
          PY
