name: Nevergone Controls Cocos backrefs smoke

on:
  pull_request:
    paths:
      - 'tools/ml/audit_nevergone_controls_cocos_backrefs.py'
      - 'tools/ml/nevergone_controls_cocos_backrefs_smoke.py'
      - 'tools/ml/run_nevergone_controls_cocos_backrefs.sh'
      - '.github/workflows/ml-controls-cocos-backrefs-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/audit_nevergone_controls_cocos_backrefs.py'
      - 'tools/ml/nevergone_controls_cocos_backrefs_smoke.py'
      - 'tools/ml/run_nevergone_controls_cocos_backrefs.sh'
      - '.github/workflows/ml-controls-cocos-backrefs-smoke.yml'

jobs:
  controls-cocos-backrefs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact-ELF backref checker
        run: |
          python3 -m py_compile tools/ml/audit_nevergone_controls_cocos_backrefs.py
          PYTHONPATH=tools/ml python3 tools/ml/nevergone_controls_cocos_backrefs_smoke.py
          bash -n tools/ml/run_nevergone_controls_cocos_backrefs.sh
