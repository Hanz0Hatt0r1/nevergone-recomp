name: Nevergone correctness meta routing v7

on:
  pull_request:
    paths:
      - 'tools/ml/evaluate_nevergone_correctness_meta_routing_v7.py'
      - 'tools/ml/nevergone_correctness_meta_routing_v7_smoke.py'
      - 'tools/ml/run_nevergone_correctness_meta_routing_v7.sh'
      - 'docs/ml/PRODUCTION_ROUTING_V7.md'
      - '.github/workflows/ml-correctness-meta-routing-v7-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/evaluate_nevergone_correctness_meta_routing_v7.py'
      - 'tools/ml/nevergone_correctness_meta_routing_v7_smoke.py'
      - 'tools/ml/run_nevergone_correctness_meta_routing_v7.sh'
      - 'docs/ml/PRODUCTION_ROUTING_V7.md'
      - '.github/workflows/ml-correctness-meta-routing-v7-smoke.yml'

jobs:
  correctness-meta-routing-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install -U numpy scikit-learn joblib
      - name: Validate v7 correctness meta routing
        run: |
          python -m py_compile \
            tools/ml/evaluate_nevergone_correctness_meta_routing_v7.py \
            tools/ml/nevergone_correctness_meta_routing_v7_smoke.py
          PYTHONPATH=tools/ml python tools/ml/nevergone_correctness_meta_routing_v7_smoke.py
          bash -n tools/ml/run_nevergone_correctness_meta_routing_v7.sh
