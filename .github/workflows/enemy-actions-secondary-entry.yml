name: EnemyActions secondary entry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile secondary entry smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/enemy_actions_secondary_entry_smoke.cpp \
            -o /tmp/enemy_actions_secondary_entry_smoke

      - name: Run secondary entry smoke
        run: /tmp/enemy_actions_secondary_entry_smoke
