name: Controls function state runtime

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/controls_function_state_runtime.*'
      - 'android/app/src/main/cpp/controls_function_state_contract.*'
      - 'android/app/src/main/cpp/player_function_action_contract.*'
      - 'tools/controls_function_state_runtime_smoke.cpp'
      - '.github/workflows/controls-function-state-runtime.yml'
  push:
    paths:
      - 'android/app/src/main/cpp/controls_function_state_runtime.*'
      - 'android/app/src/main/cpp/controls_function_state_contract.*'
      - 'android/app/src/main/cpp/player_function_action_contract.*'
      - 'tools/controls_function_state_runtime_smoke.cpp'
      - '.github/workflows/controls-function-state-runtime.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run live Controls function-state smoke
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/controls_function_state_runtime_smoke.cpp \
            android/app/src/main/cpp/controls_function_state_runtime.cpp \
            android/app/src/main/cpp/controls_function_state_contract.cpp \
            android/app/src/main/cpp/player_function_action_contract.cpp \
            -o /tmp/controls_function_state_runtime_smoke
          /tmp/controls_function_state_runtime_smoke
