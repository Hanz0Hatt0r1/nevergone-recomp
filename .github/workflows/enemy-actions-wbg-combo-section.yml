name: EnemyActions WBG combo section

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile combo-section WBG smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/hp_data_reader.cpp \
            android/app/src/main/cpp/enemy_actions_layout_evidence.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_combo_section.cpp \
            tools/enemy_actions_wbg_combo_section_smoke.cpp \
            -o /tmp/enemy_actions_wbg_combo_section_smoke

      - name: Run combo-section WBG smoke
        run: /tmp/enemy_actions_wbg_combo_section_smoke
