name: SceneActions pair spatial hit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pair-spatial-hit smoke
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iandroid/app/src/main/cpp
          tools/scene_actions_pair_spatial_hit_smoke.cpp
          -o /tmp/scene_actions_pair_spatial_hit_smoke
      - name: Run pair-spatial-hit smoke
        run: /tmp/scene_actions_pair_spatial_hit_smoke
