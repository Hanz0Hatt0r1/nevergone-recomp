name: EnemyObject action-init evidence

on:
  pull_request:
    paths:
      - 'tools/enemy_object_action_init_evidence.py'
      - 'tools/enemy_object_action_init_evidence_smoke.py'
      - 'tools/enemy_action_init_caller_arguments.py'
      - 'tools/enemy_action_init_caller_arguments_smoke.py'
      - 'tools/enemy_action_factory_call_matrix.py'
      - 'tools/enemy_action_factory_call_matrix_smoke.py'
      - 'tools/run_enemy_object_action_init_probe.py'
      - 'tools/run_enemy_action_factory_call_matrix.py'
      - 'tools/ghidra/ExportFunctionPcodeFlow.java'
      - 'tools/ghidra/ExportBoundedCallGraphPcodeFlow.java'
      - 'tools/ghidra/ExportBoundedReverseCallGraphPcodeFlow.java'
      - 'tools/ghidra/ExportCallerArgumentSubtree.java'
      - 'tools/ghidra/ExportCallerFunctionIdentities.java'
      - '.github/workflows/enemy-object-action-init-evidence.yml'
      - 'docs/enemy-object-action-init-evidence.md'
  push:
    branches-ignore: [main]
    paths:
      - 'tools/enemy_object_action_init_evidence.py'
      - 'tools/enemy_object_action_init_evidence_smoke.py'
      - 'tools/enemy_action_init_caller_arguments.py'
      - 'tools/enemy_action_init_caller_arguments_smoke.py'
      - 'tools/enemy_action_factory_call_matrix.py'
      - 'tools/enemy_action_factory_call_matrix_smoke.py'
      - 'tools/run_enemy_object_action_init_probe.py'
      - 'tools/run_enemy_action_factory_call_matrix.py'
      - 'tools/ghidra/ExportFunctionPcodeFlow.java'
      - 'tools/ghidra/ExportBoundedCallGraphPcodeFlow.java'
      - 'tools/ghidra/ExportBoundedReverseCallGraphPcodeFlow.java'
      - 'tools/ghidra/ExportCallerArgumentSubtree.java'
      - 'tools/ghidra/ExportCallerFunctionIdentities.java'
      - '.github/workflows/enemy-object-action-init-evidence.yml'
      - 'docs/enemy-object-action-init-evidence.md'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate EnemyObject action-init argument tracing
        run: python3 tools/enemy_object_action_init_evidence_smoke.py
      - name: Validate EnemyActions init caller argument planning
        run: python3 tools/enemy_action_init_caller_arguments_smoke.py
      - name: Validate createWithFile per-call matrix
        run: |
          python3 tools/enemy_action_factory_call_matrix_smoke.py
          grep -q 'getName(true)' tools/ghidra/ExportCallerFunctionIdentities.java
      - name: Validate probe wrapper CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_enemy_object_action_init_probe.py \
            --project-dir /tmp/not-a-real-ghidra-project \
            --project-name Nevergone \
            --program libcocos2dcpp.so \
            --dry-run > /tmp/enemy-object-action-init-probe.txt
          grep -q 'loadEnemyObjectFile' /tmp/enemy-object-action-init-probe.txt
          grep -q 'ExportBoundedCallGraphPcodeFlow.java' /tmp/enemy-object-action-init-probe.txt
          grep -q 'ExportBoundedReverseCallGraphPcodeFlow.java' /tmp/enemy-object-action-init-probe.txt
          grep -q 'ExportCallerArgumentSubtree.java' /tmp/enemy-object-action-init-probe.txt
          grep -q 'EnemyActionsSystem::initWithFile' /tmp/enemy-object-action-init-probe.txt
          grep -q 'enemy_object_action_init_evidence.py' /tmp/enemy-object-action-init-probe.txt
          grep -q 'enemy_action_init_caller_arguments.py plan' /tmp/enemy-object-action-init-probe.txt
          grep -q 'enemy_action_init_caller_arguments.py factory-plan' /tmp/enemy-object-action-init-probe.txt
          grep -q 'enemy_action_init_caller_arguments.py report' /tmp/enemy-object-action-init-probe.txt
          grep -q 'EnemyActions createWithFile caller parameter subtree evidence' /tmp/enemy-object-action-init-probe.txt
          grep -q -- '-recursive' /tmp/enemy-object-action-init-probe.txt
          grep -q 'fallback only when the forward analyzer returns status 2' /tmp/enemy-object-action-init-probe.txt
          grep -q 'receiver + explicit caller arguments' /tmp/enemy-object-action-init-probe.txt
          grep -q 'trace every direct createWithFile call parameter one caller level higher' /tmp/enemy-object-action-init-probe.txt
          grep -q ' 4 96' /tmp/enemy-object-action-init-probe.txt
          if grep -Eq '002adcb0|0028ee34' /tmp/enemy-object-action-init-probe.txt; then
            echo 'ELF offsets leaked into default Ghidra probe command' >&2
            exit 1
          fi

          python3 tools/run_enemy_action_factory_call_matrix.py \
            --project-dir /tmp/not-a-real-ghidra-project \
            --project-name Nevergone \
            --program libcocos2dcpp.so \
            --subtrees /tmp/not-a-real-subtrees.tsv \
            --dry-run > /tmp/enemy-action-factory-call-matrix.txt
          grep -q 'ExportCallerFunctionIdentities.java' /tmp/enemy-action-factory-call-matrix.txt
          grep -q 'enemy_action_factory_call_matrix.py' /tmp/enemy-action-factory-call-matrix.txt
          grep -q -- '-recursive' /tmp/enemy-action-factory-call-matrix.txt
