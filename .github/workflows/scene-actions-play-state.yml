name: SceneActions play state

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SceneActions play-state smoke
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/scene_actions_play_state_smoke.cpp \
            -o /tmp/scene_actions_play_state_smoke
          /tmp/scene_actions_play_state_smoke
