name: GameScene player joystick input

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_scene_player_joystick_input.*'
      - 'android/app/src/main/cpp/game_scene_player_motion_state.h'
      - 'android/app/src/main/cpp/player_motion_contract.h'
      - 'android/app/src/main/cpp/player_direction_combo_contract.h'
      - 'android/app/src/main/cpp/player_control_contract.*'
      - 'android/app/src/main/cpp/player_control_runtime_state.*'
      - 'android/app/src/main/cpp/controls_function_state_runtime.*'
      - 'android/app/src/main/cpp/controls_function_state_contract.*'
      - 'android/app/src/main/cpp/player_function_action_contract.*'
      - 'android/app/src/main/cpp/meplayer_live_action_state.*'
      - 'android/app/src/main/cpp/minimal_runtime_save_runtime.*'
      - 'android/app/src/main/cpp/minimal_runtime_save.*'
      - 'android/app/src/main/cpp/player_action_runtime_bridge.cpp'
      - 'android/app/src/main/cpp/tutorial_gameplay_state.*'
      - 'android/app/src/main/cpp/render_bridge.cpp'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/game_scene_player_joystick_input_smoke.cpp'
      - 'tools/game_scene_player_motion_state_smoke.cpp'
      - 'tools/player_motion_contract_smoke.cpp'
      - 'tools/player_direction_combo_contract_smoke.cpp'
      - '.github/workflows/game-scene-player-joystick-input.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_scene_player_joystick_input.*'
      - 'android/app/src/main/cpp/game_scene_player_motion_state.h'
      - 'android/app/src/main/cpp/player_motion_contract.h'
      - 'android/app/src/main/cpp/player_direction_combo_contract.h'
      - 'android/app/src/main/cpp/player_control_contract.*'
      - 'android/app/src/main/cpp/player_control_runtime_state.*'
      - 'android/app/src/main/cpp/controls_function_state_runtime.*'
      - 'android/app/src/main/cpp/controls_function_state_contract.*'
      - 'android/app/src/main/cpp/player_function_action_contract.*'
      - 'android/app/src/main/cpp/meplayer_live_action_state.*'
      - 'android/app/src/main/cpp/minimal_runtime_save_runtime.*'
      - 'android/app/src/main/cpp/minimal_runtime_save.*'
      - 'android/app/src/main/cpp/player_action_runtime_bridge.cpp'
      - 'android/app/src/main/cpp/tutorial_gameplay_state.*'
      - 'android/app/src/main/cpp/render_bridge.cpp'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/game_scene_player_joystick_input_smoke.cpp'
      - 'tools/game_scene_player_motion_state_smoke.cpp'
      - 'tools/player_motion_contract_smoke.cpp'
      - 'tools/player_direction_combo_contract_smoke.cpp'
      - '.github/workflows/game-scene-player-joystick-input.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run GameScene joystick input smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/game_clock.cpp \
            android/app/src/main/cpp/player_control_contract.cpp \
            android/app/src/main/cpp/player_control_runtime_state.cpp \
            android/app/src/main/cpp/tutorial_gameplay_state.cpp \
            android/app/src/main/cpp/game_scene_player_joystick_input.cpp \
            android/app/src/main/cpp/controls_function_state_runtime.cpp \
            android/app/src/main/cpp/controls_function_state_contract.cpp \
            android/app/src/main/cpp/player_function_action_contract.cpp \
            android/app/src/main/cpp/meplayer_live_action_state.cpp \
            android/app/src/main/cpp/minimal_runtime_save_runtime.cpp \
            android/app/src/main/cpp/minimal_runtime_save.cpp \
            tools/game_scene_player_joystick_input_smoke.cpp \
            -o /tmp/game_scene_player_joystick_input_smoke
          /tmp/game_scene_player_joystick_input_smoke
      - name: Build and run player motion contract smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/player_motion_contract_smoke.cpp \
            -o /tmp/player_motion_contract_smoke
          /tmp/player_motion_contract_smoke
      - name: Build and run horizontal direction-combo contract smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/player_direction_combo_contract_smoke.cpp \
            -o /tmp/player_direction_combo_contract_smoke
          /tmp/player_direction_combo_contract_smoke
      - name: Build and run fixed-tick motion-state smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/game_scene_player_motion_state_smoke.cpp \
            -o /tmp/game_scene_player_motion_state_smoke
          /tmp/game_scene_player_motion_state_smoke
