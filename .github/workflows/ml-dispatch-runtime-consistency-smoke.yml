name: Nevergone ML dispatch runtime consistency smoke

on:
  pull_request:
    paths:
      - 'tools/ml/analyze_nevergone_dispatch_runtime_consistency.py'
      - 'tools/ml/nevergone_dispatch_runtime_consistency_smoke.py'
      - '.github/workflows/ml-dispatch-runtime-consistency-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile scripts
        run: python3 -m py_compile tools/ml/analyze_nevergone_dispatch_runtime_consistency.py tools/ml/nevergone_dispatch_runtime_consistency_smoke.py
      - name: Run smoke
        run: python3 tools/ml/nevergone_dispatch_runtime_consistency_smoke.py
