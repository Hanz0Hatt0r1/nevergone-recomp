name: GameScene frame asset requests

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_scene_frame_asset_requests.h'
      - 'android/app/src/main/cpp/game_scene_frame_asset_bridge.cpp'
      - 'android/app/src/main/java/org/nevergone/recomp/GameSceneFrameAssetRequests.java'
      - 'tools/game_scene_frame_asset_requests_smoke.cpp'
      - '.github/workflows/game-scene-frame-asset-requests.yml'
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_scene_frame_asset_requests.h'
      - 'android/app/src/main/cpp/game_scene_frame_asset_bridge.cpp'
      - 'android/app/src/main/java/org/nevergone/recomp/GameSceneFrameAssetRequests.java'
      - 'tools/game_scene_frame_asset_requests_smoke.cpp'
      - '.github/workflows/game-scene-frame-asset-requests.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run frame request smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_scene_frame_asset_requests_smoke.cpp \
            -o /tmp/game_scene_frame_asset_requests_smoke
          /tmp/game_scene_frame_asset_requests_smoke
      - name: Syntax-check JNI request bridge
        run: |
          JAVA_HOME_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -I android/app/src/main/cpp \
            -I "$JAVA_HOME_PATH/include" \
            -I "$JAVA_HOME_PATH/include/linux" \
            android/app/src/main/cpp/game_scene_frame_asset_bridge.cpp
