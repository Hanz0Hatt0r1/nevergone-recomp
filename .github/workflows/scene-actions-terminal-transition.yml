name: SceneActions terminal transition

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/scene_actions_terminal_transition.h'
      - 'android/app/src/main/cpp/scene_actions_play_state.h'
      - 'tools/scene_actions_terminal_transition_smoke.cpp'
      - '.github/workflows/scene-actions-terminal-transition.yml'
  push:
    paths:
      - 'android/app/src/main/cpp/scene_actions_terminal_transition.h'
      - 'android/app/src/main/cpp/scene_actions_play_state.h'
      - 'tools/scene_actions_terminal_transition_smoke.cpp'
      - '.github/workflows/scene-actions-terminal-transition.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SceneActions terminal-transition smoke
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/scene_actions_terminal_transition_smoke.cpp \
            -o /tmp/scene_actions_terminal_transition_smoke
          /tmp/scene_actions_terminal_transition_smoke
