name: Nevergone unidbg ActionData create probe contract

on:
  pull_request:
    paths:
      - 'tools/unidbg/src/main/java/nevergone/ActionDataCreateProbe.java'
      - 'tools/unidbg/src/main/java/nevergone/NevergoneHarness.java'
      - 'tools/unidbg/verify_action_data_create_probe.py'
      - '.github/workflows/unidbg-action-data-create-probe-contract.yml'

jobs:
  action-data-create-probe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bounded create probe contract
        run: python3 tools/unidbg/verify_action_data_create_probe.py
