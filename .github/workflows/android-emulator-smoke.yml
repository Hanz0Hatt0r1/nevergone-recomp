name: Android emulator smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2,5'

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch:
    name: API ${{ matrix.api-level }} launch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;28.2.13676358'

      - name: Prepare verified Lua 5.2.3
        run: python3 tools/fetch_lua_5_2_3.py

      - name: Build emulator-only x86_64 debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: gradle --no-daemon --stacktrace -PciEmulator assembleDebug

      - name: Launch and check process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n org.nevergone.recomp/.MainActivity
            sleep 5
            PID="$(adb shell pidof org.nevergone.recomp | tr -d '\r')"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -q 'org.nevergone.recomp'
            if adb logcat -d | grep -E 'FATAL EXCEPTION|Fatal signal.*org.nevergone.recomp'; then
              echo 'Never Gone Recomp crashed during launch smoke' >&2
              exit 1
            fi
            adb shell am force-stop org.nevergone.recomp
