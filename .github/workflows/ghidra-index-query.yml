name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - 'tools/ghidra/player_spawn_evidence.py'
      - 'tools/ghidra/test_player_spawn_evidence.py'
      - 'tools/ghidra/ExportFunctionPcodeFlow.java'
      - 'tools/ghidra/trace_pcode_flow.py'
      - 'tools/ghidra/test_trace_pcode_flow.py'
      - 'tools/ghidra/ExportFieldStoreCandidates.java'
      - 'tools/ghidra/summarize_field_store_candidates.py'
      - 'tools/ghidra/test_summarize_field_store_candidates.py'
      - 'tools/ghidra/run_player_current_frame_probe.sh'
      - 'docs/player-current-frame-probe.md'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - 'tools/ghidra/player_spawn_evidence.py'
      - 'tools/ghidra/test_player_spawn_evidence.py'
      - 'tools/ghidra/ExportFunctionPcodeFlow.java'
      - 'tools/ghidra/trace_pcode_flow.py'
      - 'tools/ghidra/test_trace_pcode_flow.py'
      - 'tools/ghidra/ExportFieldStoreCandidates.java'
      - 'tools/ghidra/summarize_field_store_candidates.py'
      - 'tools/ghidra/test_summarize_field_store_candidates.py'
      - 'tools/ghidra/run_player_current_frame_probe.sh'
      - 'docs/player-current-frame-probe.md'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tools
        run: |
          python -m py_compile \
            tools/ghidra/query_full_index.py \
            tools/ghidra/test_query_full_index.py \
            tools/ghidra/player_spawn_evidence.py \
            tools/ghidra/test_player_spawn_evidence.py \
            tools/ghidra/trace_pcode_flow.py \
            tools/ghidra/test_trace_pcode_flow.py \
            tools/ghidra/summarize_field_store_candidates.py \
            tools/ghidra/test_summarize_field_store_candidates.py
          bash -n tools/ghidra/run_player_current_frame_probe.sh
      - name: Run query smoke tests
        run: |
          python tools/ghidra/test_query_full_index.py
          python tools/ghidra/test_player_spawn_evidence.py
          python tools/ghidra/test_trace_pcode_flow.py
          python tools/ghidra/test_summarize_field_store_candidates.py
      - name: Query checked-in SingleLogin metadata
        run: |
          python tools/ghidra/query_full_index.py functions SingleLoginLayer --limit 5
          python tools/ghidra/query_full_index.py strings zjmshandian --limit 7
          python tools/ghidra/query_full_index.py atlases zjmshandian --limit 7
      - name: Correlate checked-in player-spawn metadata
        run: |
          python tools/ghidra/player_spawn_evidence.py
          python tools/ghidra/query_full_index.py callees GameScene::loadGameSceneList --limit 100
