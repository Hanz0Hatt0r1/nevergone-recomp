name: Nevergone ML receiver-vtable slot resolver smoke

on:
  pull_request:
    paths:
      - 'tools/ml/resolve_nevergone_receiver_vtable_slots.py'
      - 'tools/ml/nevergone_receiver_vtable_slot_resolver_smoke.py'
      - '.github/workflows/ml-receiver-vtable-slot-resolver-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile resolver tools
        run: |
          python -m py_compile \
            tools/ml/resolve_nevergone_receiver_vtable_slots.py \
            tools/ml/nevergone_receiver_vtable_slot_resolver_smoke.py
      - name: Run receiver-vtable slot resolver smoke
        run: python tools/ml/nevergone_receiver_vtable_slot_resolver_smoke.py
