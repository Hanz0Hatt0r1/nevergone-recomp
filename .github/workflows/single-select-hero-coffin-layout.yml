name: SingleSelectHero coffin layout

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/single_select_hero_coffin_layout.h'
      - 'tools/single_select_hero_coffin_layout_smoke.cpp'
      - '.github/workflows/single-select-hero-coffin-layout.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'android/app/src/main/cpp/single_select_hero_coffin_layout.h'
      - 'tools/single_select_hero_coffin_layout_smoke.cpp'
      - '.github/workflows/single-select-hero-coffin-layout.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate coffin animation geometry
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -I android/app/src/main/cpp \
            tools/single_select_hero_coffin_layout_smoke.cpp \
            -o /tmp/single_select_hero_coffin_layout_smoke
          /tmp/single_select_hero_coffin_layout_smoke
