name: Nevergone Production Classifier v5.3 game verifier

on:
  pull_request:
    paths:
      - 'tools/ml/evaluate_nevergone_game_verifier_v53.py'
      - 'tools/ml/nevergone_game_verifier_v53_smoke.py'
      - 'tools/ml/run_nevergone_game_verifier_v53.sh'
      - 'docs/ml/PRODUCTION_CLASSIFIER_V53.md'
      - '.github/workflows/ml-production-classifier-v53-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/evaluate_nevergone_game_verifier_v53.py'
      - 'tools/ml/nevergone_game_verifier_v53_smoke.py'
      - 'tools/ml/run_nevergone_game_verifier_v53.sh'
      - 'docs/ml/PRODUCTION_CLASSIFIER_V53.md'
      - '.github/workflows/ml-production-classifier-v53-smoke.yml'

jobs:
  production-classifier-v53:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install -U numpy scikit-learn joblib
      - name: Validate nested game verifier
        run: |
          python -m py_compile \
            tools/ml/evaluate_nevergone_game_verifier_v53.py \
            tools/ml/nevergone_game_verifier_v53_smoke.py
          PYTHONPATH=tools/ml python tools/ml/nevergone_game_verifier_v53_smoke.py
          bash -n tools/ml/run_nevergone_game_verifier_v53.sh
