name: Nevergone Controls dlsym closure smoke

on:
  pull_request:
    paths:
      - 'tools/ml/audit_nevergone_controls_dlsym_closure.py'
      - 'tools/ml/nevergone_controls_dlsym_closure_smoke.py'
      - 'tools/ml/run_nevergone_controls_dlsym_closure.sh'
      - '.github/workflows/ml-controls-dlsym-closure-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/audit_nevergone_controls_dlsym_closure.py'
      - 'tools/ml/nevergone_controls_dlsym_closure_smoke.py'
      - 'tools/ml/run_nevergone_controls_dlsym_closure.sh'
      - '.github/workflows/ml-controls-dlsym-closure-smoke.yml'

jobs:
  controls-dlsym-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dlsym closure audit
        run: |
          python3 -m py_compile tools/ml/audit_nevergone_controls_dlsym_closure.py
          PYTHONPATH=tools/ml python3 tools/ml/nevergone_controls_dlsym_closure_smoke.py
          bash -n tools/ml/run_nevergone_controls_dlsym_closure.sh
