name: SceneActions base sprite update

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/scene_actions_base_sprite_update.h'
      - 'android/app/src/main/cpp/enemy_actions_wbg_prefix.h'
      - 'tools/scene_actions_base_sprite_update_smoke.cpp'
      - '.github/workflows/scene-actions-base-sprite-update.yml'
  push:
    branches: [ main ]
    paths:
      - 'android/app/src/main/cpp/scene_actions_base_sprite_update.h'
      - 'android/app/src/main/cpp/enemy_actions_wbg_prefix.h'
      - 'tools/scene_actions_base_sprite_update_smoke.cpp'
      - '.github/workflows/scene-actions-base-sprite-update.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SceneActions base sprite update smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/scene_actions_base_sprite_update_smoke.cpp \
            -o /tmp/scene_actions_base_sprite_update_smoke
          /tmp/scene_actions_base_sprite_update_smoke
