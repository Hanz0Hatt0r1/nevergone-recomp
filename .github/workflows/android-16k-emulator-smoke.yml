name: Android 16 KiB emulator smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 4'
  pull_request:
    paths:
      - '.github/workflows/android-16k-emulator-smoke.yml'
      - 'tools/android_16k_runtime_smoke.sh'
      - 'tools/android_emulator_lifecycle_smoke.sh'
      - 'tools/android_runtime_diagnostics.py'
      - 'tools/test_android_runtime_diagnostics.py'

permissions:
  contents: read

concurrency:
  group: emulator-16k-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-16k:
    name: API 35 x86_64 16 KiB lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM acceleration when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo '::notice::/dev/kvm is unavailable on this hosted runner; using Android emulator software acceleration fallback.'
            exit 0
          fi

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo 'KVM acceleration is available to the Android emulator.'
          ls -l /dev/kvm

      - name: Test runtime diagnostics parser
        run: |
          python3 -m py_compile \
            tools/android_runtime_diagnostics.py \
            tools/test_android_runtime_diagnostics.py
          python3 tools/test_android_runtime_diagnostics.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;28.2.13676358'

      - name: Prepare verified Lua 5.2.3
        run: python3 tools/fetch_lua_5_2_3.py

      - name: Build emulator-only x86_64 debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: gradle --no-daemon --stacktrace -PciEmulator assembleDebug

      - name: Launch on Android 15 16 KiB image
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: false
          script: bash tools/android_16k_runtime_smoke.sh
