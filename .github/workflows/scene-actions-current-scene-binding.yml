name: SceneActions current-scene binding

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/scene_actions_current_scene_binding.h'
      - 'android/app/src/main/cpp/scene_action_trigger_plan.h'
      - 'android/app/src/main/cpp/game_scene_render_queue.h'
      - 'tools/scene_actions_current_scene_binding_smoke.cpp'
      - '.github/workflows/scene-actions-current-scene-binding.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SceneActions current-scene binding smoke
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/scene_actions_current_scene_binding_smoke.cpp \
            -o /tmp/scene_actions_current_scene_binding_smoke
          /tmp/scene_actions_current_scene_binding_smoke
