name: Nevergone frozen unseen500 v10

on:
  push:
    paths:
      - 'tools/ml/freeze_nevergone_unseen_corpus.py'
      - 'tools/ml/audit_nevergone_frozen_drift_v10.py'
      - 'tools/ml/nevergone_frozen_validation_corpus_smoke.py'
      - 'tools/ml/nevergone_frozen_drift_v10_smoke.py'
      - 'tools/ml/run_nevergone_frozen_unseen500_v10.sh'
      - 'tools/ml/select_nevergone_internal_test_corpus.py'
      - 'docs/ml/FROZEN_UNSEEN500_V10.md'
      - 'tools/ml/nevergone_frozen_receiver_coverage_smoke.py'
      - 'docs/evidence/frozen-unseen500-v10-receiver-coverage/**'
      - '.github/workflows/ml-frozen-unseen-v10-smoke.yml'
  pull_request:
    paths:
      - 'tools/ml/freeze_nevergone_unseen_corpus.py'
      - 'tools/ml/audit_nevergone_frozen_drift_v10.py'
      - 'tools/ml/nevergone_frozen_validation_corpus_smoke.py'
      - 'tools/ml/nevergone_frozen_drift_v10_smoke.py'
      - 'tools/ml/run_nevergone_frozen_unseen500_v10.sh'
      - 'tools/ml/select_nevergone_internal_test_corpus.py'
      - 'docs/ml/FROZEN_UNSEEN500_V10.md'
      - 'tools/ml/nevergone_frozen_receiver_coverage_smoke.py'
      - 'docs/evidence/frozen-unseen500-v10-receiver-coverage/**'
      - '.github/workflows/ml-frozen-unseen-v10-smoke.yml'

permissions:
  contents: read

jobs:
  frozen-validation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and shell syntax
        run: |
          python -m py_compile \
            tools/ml/freeze_nevergone_unseen_corpus.py \
            tools/ml/audit_nevergone_frozen_drift_v10.py \
            tools/ml/nevergone_frozen_validation_corpus_smoke.py \
            tools/ml/nevergone_frozen_drift_v10_smoke.py
          bash -n tools/ml/run_nevergone_frozen_unseen500_v10.sh
      - name: Run frozen validation corpus smoke
        run: python tools/ml/nevergone_frozen_validation_corpus_smoke.py
      - name: Run frozen distribution-shift audit smoke
        run: python tools/ml/nevergone_frozen_drift_v10_smoke.py

  receiver-coverage-report-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Hanz0Hatt0r1/revenginstr
          ref: 2b3774f0f74811c336c5cae7dd8e615b26581160
          path: revenginstr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned shared benchmark tooling
        run: python -m pip install -e 'revenginstr[benchmark]'
      - name: Verify pinned revision and replay frozen receiver report
        run: |
          test "$(git -C revenginstr rev-parse HEAD)" = '2b3774f0f74811c336c5cae7dd8e615b26581160'
          python -m py_compile tools/ml/nevergone_frozen_receiver_coverage_smoke.py
          python tools/ml/nevergone_frozen_receiver_coverage_smoke.py
