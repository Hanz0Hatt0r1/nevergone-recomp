name: GameScene direct asset store

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_scene_direct_asset_store.cpp'
      - 'android/app/src/main/cpp/game_scene_direct_asset_store.h'
      - 'android/app/src/main/cpp/game_scene_direct_asset_store_bridge.cpp'
      - 'android/app/src/main/java/org/nevergone/recomp/GameSceneDirectAssetStore.java'
      - 'tools/game_scene_direct_asset_store_smoke.cpp'
      - '.github/workflows/game-scene-direct-asset-store.yml'
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_scene_direct_asset_store.cpp'
      - 'android/app/src/main/cpp/game_scene_direct_asset_store.h'
      - 'android/app/src/main/cpp/game_scene_direct_asset_store_bridge.cpp'
      - 'android/app/src/main/java/org/nevergone/recomp/GameSceneDirectAssetStore.java'
      - 'tools/game_scene_direct_asset_store_smoke.cpp'
      - '.github/workflows/game-scene-direct-asset-store.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run direct asset store smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_scene_direct_asset_store_smoke.cpp \
            android/app/src/main/cpp/game_scene_direct_asset_store.cpp \
            -o /tmp/game_scene_direct_asset_store_smoke
          /tmp/game_scene_direct_asset_store_smoke
      - name: Validate JNI store bridge translation unit
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -I android/app/src/main/cpp \
            -I "$JAVA_HOME/include" \
            -I "$JAVA_HOME/include/linux" \
            android/app/src/main/cpp/game_scene_direct_asset_store_bridge.cpp
