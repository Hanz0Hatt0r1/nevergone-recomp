name: GameScene action layout

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_scene_action_layout.*'
      - 'android/app/src/main/cpp/game_scene_action_input.h'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/game_scene_action_layout_smoke.cpp'
      - '.github/workflows/game-scene-action-layout.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_scene_action_layout.*'
      - 'android/app/src/main/cpp/game_scene_action_input.h'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/game_scene_action_layout_smoke.cpp'
      - '.github/workflows/game-scene-action-layout.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Controls action-layout smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/game_scene_action_layout.cpp \
            tools/game_scene_action_layout_smoke.cpp \
            -o /tmp/game_scene_action_layout_smoke
          /tmp/game_scene_action_layout_smoke
