name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Query offline role-route evidence
        run: |
          echo '=== FUNCTIONS ==='
          python tools/ghidra/query_full_index.py functions OnSelectCharacter --limit 30 || true
          python tools/ghidra/query_full_index.py functions ReadIcloud --limit 30 || true
          python tools/ghidra/query_full_index.py functions GoToChooseRole --limit 30 || true
          python tools/ghidra/query_full_index.py functions showChooseHeroPane --limit 30 || true
          python tools/ghidra/query_full_index.py functions LoadStandaloneHeroDataList --limit 30 || true
          python tools/ghidra/query_full_index.py functions Opening --limit 80 || true
          echo '=== OnSelectCharacter call graph ==='
          python tools/ghidra/query_full_index.py callers 00307154 --limit 50 || true
          python tools/ghidra/query_full_index.py callees 00307154 --limit 100 || true
