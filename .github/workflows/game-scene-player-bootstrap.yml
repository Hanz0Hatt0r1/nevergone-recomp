name: GameScene player bootstrap contract

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_scene_player_bootstrap.cpp'
      - 'android/app/src/main/cpp/game_scene_player_bootstrap.h'
      - 'tools/game_scene_player_bootstrap_smoke.cpp'
      - 'docs/player-bootstrap-evidence.md'
      - '.github/workflows/game-scene-player-bootstrap.yml'
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_scene_player_bootstrap.cpp'
      - 'android/app/src/main/cpp/game_scene_player_bootstrap.h'
      - 'tools/game_scene_player_bootstrap_smoke.cpp'
      - 'docs/player-bootstrap-evidence.md'
      - '.github/workflows/game-scene-player-bootstrap.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run player bootstrap smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_scene_player_bootstrap_smoke.cpp \
            android/app/src/main/cpp/game_scene_player_bootstrap.cpp \
            -o /tmp/game_scene_player_bootstrap_smoke
          /tmp/game_scene_player_bootstrap_smoke
