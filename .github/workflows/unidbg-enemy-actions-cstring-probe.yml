name: unidbg EnemyActionsData CCString probe contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bounded CCString prerequisite probe contract
        run: python3 tools/unidbg/verify_enemy_actions_cstring_probe.py
