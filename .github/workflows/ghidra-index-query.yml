name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Trace HPData reader primitives
        run: |
          for addr in 002d64ac 002d652c 002d6568 002d658a 002d65ac 002d65ce 002d65f0 002d6612; do
            echo "=== $addr callees ==="
            python tools/ghidra/query_full_index.py callees "$addr" --limit 100 || true
            echo "=== $addr callers ==="
            python tools/ghidra/query_full_index.py callers "$addr" --limit 80 || true
            echo "=== $addr xrefs ==="
            python tools/ghidra/query_full_index.py xrefs "$addr" --limit 80 || true
          done
