name: GameLevels enter transition

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_levels_enter_transition.cpp'
      - 'android/app/src/main/cpp/game_levels_enter_transition.h'
      - 'android/app/src/main/cpp/game_levels_asset_probe.cpp'
      - 'android/app/src/main/cpp/game_levels_asset_probe.h'
      - 'android/app/src/main/cpp/game_levels_layer_tail.cpp'
      - 'android/app/src/main/cpp/game_levels_layer_tail.h'
      - 'android/app/src/main/cpp/game_levels_scene_prefix.cpp'
      - 'android/app/src/main/cpp/game_levels_scene_prefix.h'
      - 'android/app/src/main/cpp/hp_data_reader.cpp'
      - 'android/app/src/main/cpp/hp_data_reader.h'
      - 'tools/game_levels_enter_transition_smoke.cpp'
      - '.github/workflows/game-levels-enter-transition.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_levels_enter_transition.cpp'
      - 'android/app/src/main/cpp/game_levels_enter_transition.h'
      - 'android/app/src/main/cpp/game_levels_asset_probe.cpp'
      - 'android/app/src/main/cpp/game_levels_asset_probe.h'
      - 'android/app/src/main/cpp/game_levels_layer_tail.cpp'
      - 'android/app/src/main/cpp/game_levels_layer_tail.h'
      - 'android/app/src/main/cpp/game_levels_scene_prefix.cpp'
      - 'android/app/src/main/cpp/game_levels_scene_prefix.h'
      - 'android/app/src/main/cpp/hp_data_reader.cpp'
      - 'android/app/src/main/cpp/hp_data_reader.h'
      - 'tools/game_levels_enter_transition_smoke.cpp'
      - '.github/workflows/game-levels-enter-transition.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run GameLevels enter transition smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/game_levels_enter_transition_smoke.cpp \
            android/app/src/main/cpp/game_levels_enter_transition.cpp \
            android/app/src/main/cpp/game_levels_asset_probe.cpp \
            android/app/src/main/cpp/game_levels_layer_tail.cpp \
            android/app/src/main/cpp/game_levels_scene_prefix.cpp \
            android/app/src/main/cpp/hp_data_reader.cpp \
            -o /tmp/game_levels_enter_transition_smoke
          /tmp/game_levels_enter_transition_smoke
