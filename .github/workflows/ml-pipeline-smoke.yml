name: Nevergone ML pipeline smoke

on:
  push:
    paths:
      - 'tools/ml/**'
      - 'tools/ghidra/ExportMlPcodeCorpus.java'
      - 'docs/ml/**'
      - '.github/workflows/ml-pipeline-smoke.yml'
  pull_request:
    paths:
      - 'tools/ml/**'
      - 'tools/ghidra/ExportMlPcodeCorpus.java'
      - 'docs/ml/**'
      - '.github/workflows/ml-pipeline-smoke.yml'

permissions:
  contents: read

jobs:
  python-pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python tools
        run: |
          python -m py_compile \
            tools/ml/build_nevergone_dataset.py \
            tools/ml/build_nevergone_seed_labels.py \
            tools/ml/inspect_nevergone_corpus.py \
            tools/ml/nevergone_pcode_features.py \
            tools/ml/nevergone_function_origin.py \
            tools/ml/filter_nevergone_dataset_origins.py \
            tools/ml/classify_nevergone_with_origin.py \
            tools/ml/classify_nevergone_hierarchy.py \
            tools/ml/classify_nevergone_hierarchy_with_role.py \
            tools/ml/select_nevergone_internal_test_corpus.py \
            tools/ml/augment_nevergone_function_roles.py \
            tools/ml/audit_nevergone_fresh_roles.py \
            tools/ml/mine_nevergone_function_families.py \
            tools/ml/build_nevergone_similarity_index.py \
            tools/ml/search_nevergone_function_families.py \
            tools/ml/nevergone_similarity_transfer_cv.py \
            tools/ml/nevergone_nested_similarity_transfer_cv.py \
            tools/ml/nevergone_nested_evidence_fusion_cv.py \
            tools/ml/nevergone_nested_conditional_fusion_cv.py \
            tools/ml/train_nevergone_similarity_transfer.py \
            tools/ml/query_nevergone_similarity_transfer.py \
            tools/ml/attach_nevergone_similarity_transfer.py \
            tools/ml/nevergone_family_grouped_cv.py \
            tools/ml/nevergone_nested_routing_cv.py \
            tools/ml/nevergone_nested_routing_audit.py \
            tools/ml/nevergone_nested_selective_metrics.py \
            tools/ml/nevergone_tiny_encoder_features.py \
            tools/ml/nevergone_tiny_encoder_cv.py \
            tools/ml/nevergone_hybrid_residual_cv.py \
            tools/ml/nevergone_ood_similarity.py \
            tools/ml/train_nevergone_production_classifier.py \
            tools/ml/train_nevergone_production_classifier_v3.py \
            tools/ml/train_nevergone_production_classifier_v4.py \
            tools/ml/classify_nevergone_pcode.py \
            tools/ml/audit_nevergone_classifications.py \
            tools/ml/nevergone_ml_pipeline_smoke.py \
            tools/ml/nevergone_family_miner_smoke.py \
            tools/ml/nevergone_tiny_encoder_smoke.py \
            tools/ml/nevergone_production_classifier_smoke.py \
            tools/ml/nevergone_classification_audit_smoke.py \
            tools/ml/nevergone_function_origin_smoke.py \
            tools/ml/nevergone_internal_test_corpus_smoke.py \
            tools/ml/nevergone_hierarchical_router_smoke.py \
            tools/ml/nevergone_hierarchy_with_role_smoke.py \
            tools/ml/nevergone_function_role_smoke.py \
            tools/ml/nevergone_fresh_role_audit_smoke.py \
            tools/ml/nevergone_similarity_search_smoke.py \
            tools/ml/nevergone_similarity_transfer_cv_smoke.py \
            tools/ml/nevergone_nested_similarity_transfer_cv_smoke.py \
            tools/ml/nevergone_similarity_transfer_production_smoke.py \
            tools/ml/nevergone_evidence_fusion_smoke.py \
            tools/ml/nevergone_conditional_fusion_smoke.py \
            tools/ml/nevergone_nested_selective_metrics_smoke.py
      - name: Run synthetic pipeline smoke
        run: python tools/ml/nevergone_ml_pipeline_smoke.py
      - name: Run function family miner smoke
        run: python tools/ml/nevergone_family_miner_smoke.py
      - name: Run tiny encoder feature smoke
        run: python tools/ml/nevergone_tiny_encoder_smoke.py
      - name: Run production classifier helper smoke
        run: python tools/ml/nevergone_production_classifier_smoke.py
      - name: Run classification audit smoke
        run: python tools/ml/nevergone_classification_audit_smoke.py
      - name: Run function origin smoke
        run: python tools/ml/nevergone_function_origin_smoke.py
      - name: Run internal test corpus selector smoke
        run: python tools/ml/nevergone_internal_test_corpus_smoke.py
      - name: Run hierarchical router smoke
        run: python tools/ml/nevergone_hierarchical_router_smoke.py
      - name: Run hierarchy with role smoke
        run: python tools/ml/nevergone_hierarchy_with_role_smoke.py
      - name: Run function-role augmenter smoke
        run: python tools/ml/nevergone_function_role_smoke.py
      - name: Run fresh role audit smoke
        run: python tools/ml/nevergone_fresh_role_audit_smoke.py
      - name: Run similarity search smoke
        run: python tools/ml/nevergone_similarity_search_smoke.py
      - name: Run similarity transfer CV smoke
        run: python tools/ml/nevergone_similarity_transfer_cv_smoke.py
      - name: Run nested similarity transfer CV smoke
        run: python tools/ml/nevergone_nested_similarity_transfer_cv_smoke.py
      - name: Run similarity transfer production smoke
        run: python tools/ml/nevergone_similarity_transfer_production_smoke.py
      - name: Run evidence fusion smoke
        run: python tools/ml/nevergone_evidence_fusion_smoke.py
      - name: Run conditional fusion smoke
        run: python tools/ml/nevergone_conditional_fusion_smoke.py
      - name: Run nested selective metrics smoke
        run: python tools/ml/nevergone_nested_selective_metrics_smoke.py
