name: Temporary full Android build probe

on:
  push:
    branches: [fix/fresh-role-overlay-status-init]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;28.2.13676358'

      - name: Prepare verified Lua 5.2.3
        run: python3 tools/fetch_lua_5_2_3.py

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Validate 16 KiB page compatibility
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          python3 tools/check_android_16k_alignment.py "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
