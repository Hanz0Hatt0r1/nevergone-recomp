name: GameLevels scene instance

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_levels_scene_instance.cpp'
      - 'android/app/src/main/cpp/game_levels_scene_instance.h'
      - 'android/app/src/main/cpp/game_levels_model.h'
      - 'android/app/src/main/cpp/game_levels_scene_navigation.cpp'
      - 'android/app/src/main/cpp/game_levels_scene_navigation.h'
      - 'android/app/src/main/cpp/game_levels_port_navigation.cpp'
      - 'android/app/src/main/cpp/game_levels_port_navigation.h'
      - 'tools/game_levels_scene_instance_smoke.cpp'
      - '.github/workflows/game-levels-scene-instance.yml'
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_levels_scene_instance.cpp'
      - 'android/app/src/main/cpp/game_levels_scene_instance.h'
      - 'android/app/src/main/cpp/game_levels_model.h'
      - 'android/app/src/main/cpp/game_levels_scene_navigation.cpp'
      - 'android/app/src/main/cpp/game_levels_scene_navigation.h'
      - 'android/app/src/main/cpp/game_levels_port_navigation.cpp'
      - 'android/app/src/main/cpp/game_levels_port_navigation.h'
      - 'tools/game_levels_scene_instance_smoke.cpp'
      - '.github/workflows/game-levels-scene-instance.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run scene-instance smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_levels_scene_instance_smoke.cpp \
            android/app/src/main/cpp/game_levels_scene_instance.cpp \
            android/app/src/main/cpp/game_levels_scene_navigation.cpp \
            android/app/src/main/cpp/game_levels_port_navigation.cpp \
            -o /tmp/game_levels_scene_instance_smoke
          /tmp/game_levels_scene_instance_smoke
