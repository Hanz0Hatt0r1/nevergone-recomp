name: EnemyActionsData loadWBG boundary evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate loadWBG dependency boundary
        shell: bash
        run: |
          g++ -std=c++17 -O2 \
            -I android/app/src/main/cpp \
            tools/enemy_actions_load_wbg_evidence_smoke.cpp \
            android/app/src/main/cpp/enemy_actions_load_wbg_evidence.cpp \
            -o /tmp/enemy_actions_load_wbg_evidence_smoke
          /tmp/enemy_actions_load_wbg_evidence_smoke
