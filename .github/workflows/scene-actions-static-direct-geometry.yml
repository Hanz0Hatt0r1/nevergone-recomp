name: SceneActions static direct geometry

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static direct-geometry smoke
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iandroid/app/src/main/cpp
          tools/scene_actions_static_direct_geometry_smoke.cpp
          -o /tmp/scene_actions_static_direct_geometry_smoke
      - name: Run static direct-geometry smoke
        run: /tmp/scene_actions_static_direct_geometry_smoke
