name: OBB unpacker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OBB inspector and unpacker
        shell: bash
        run: |
          python3 tools/test_obb_unpack.py
          python3 tools/obb_unpack.py --help >/dev/null
