name: Tutorial gameplay state

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/tutorial_gameplay_state.*'
      - 'android/app/src/main/cpp/tutorial_session_state.*'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/tutorial_gameplay_state_smoke.cpp'
      - 'tools/tutorial_session_state_smoke.cpp'
      - 'docs/tutorial-gameplay-state.md'
      - '.github/workflows/tutorial-gameplay-state.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/tutorial_gameplay_state.*'
      - 'android/app/src/main/cpp/tutorial_session_state.*'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/tutorial_gameplay_state_smoke.cpp'
      - 'tools/tutorial_session_state_smoke.cpp'
      - 'docs/tutorial-gameplay-state.md'
      - '.github/workflows/tutorial-gameplay-state.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tutorial gameplay state smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/tutorial_gameplay_state.cpp \
            tools/tutorial_gameplay_state_smoke.cpp \
            -o /tmp/tutorial_gameplay_state_smoke
          /tmp/tutorial_gameplay_state_smoke
      - name: Build and run tutorial session lifecycle smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/tutorial_gameplay_state.cpp \
            android/app/src/main/cpp/tutorial_session_state.cpp \
            tools/tutorial_session_state_smoke.cpp \
            -o /tmp/tutorial_session_state_smoke
          /tmp/tutorial_session_state_smoke
