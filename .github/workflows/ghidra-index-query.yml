name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Query standalone hero save evidence
        run: |
          echo '=== FUNCTIONS ==='
          python tools/ghidra/query_full_index.py functions LoadStandaloneHeroDataList --limit 30 || true
          python tools/ghidra/query_full_index.py functions SaveStandaloneHero --limit 80 || true
          python tools/ghidra/query_full_index.py functions StandaloneHero --limit 100 || true
          python tools/ghidra/query_full_index.py functions createGameSaveData --limit 30 || true
          echo '=== LoadStandaloneHeroDataList call graph ==='
          python tools/ghidra/query_full_index.py callers 0034ba90 --limit 100 || true
          python tools/ghidra/query_full_index.py callees 0034ba90 --limit 200 || true
          echo '=== DIRECT STRINGS in LoadStandaloneHeroDataList ==='
          python - <<'PY'
          import base64, csv, gzip
          from pathlib import Path
          root=Path('docs/ghidra/full-index')
          def rows(name):
              with gzip.open(root/name,'rt',encoding='utf-8',newline='') as f:
                  yield from csv.DictReader(f,delimiter='\t')
          def hx(v):
              try:return int(v,16)
              except:return None
          funcs=[]
          for r in rows('libcocos2dcpp.functions.tsv.gz'):
              e=hx(r.get('entry',''))
              if e is not None: funcs.append(e)
          funcs.sort()
          start=0x0034ba90
          end=min((e for e in funcs if e>start),default=start+0x2000)
          strings={}
          for r in rows('libcocos2dcpp.strings.tsv.gz'):
              a=hx(r.get('address',''))
              if a is None: continue
              try: strings[a]=base64.b64decode(r['utf8_base64']).decode('utf-8','replace')
              except: pass
          for xr in rows('libcocos2dcpp.xrefs.tsv.gz'):
              frm=hx(xr.get('from','')); to=hx(xr.get('to',''))
              if frm is not None and to in strings and start<=frm<end:
                  print(f'{frm:08x} -> {to:08x} [{xr.get("type","")}] {strings[to]}')
          PY
