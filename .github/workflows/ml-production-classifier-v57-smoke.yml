name: Nevergone Production Classifier v5.7 constrained meta

on:
  pull_request:
    paths:
      - 'tools/ml/evaluate_nevergone_constrained_game_meta_v57.py'
      - 'tools/ml/nevergone_constrained_game_meta_v57_smoke.py'
      - 'tools/ml/run_nevergone_constrained_game_meta_v57.sh'
      - 'docs/ml/PRODUCTION_CLASSIFIER_V57.md'
      - '.github/workflows/ml-production-classifier-v57-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/evaluate_nevergone_constrained_game_meta_v57.py'
      - 'tools/ml/nevergone_constrained_game_meta_v57_smoke.py'
      - 'tools/ml/run_nevergone_constrained_game_meta_v57.sh'
      - 'docs/ml/PRODUCTION_CLASSIFIER_V57.md'
      - '.github/workflows/ml-production-classifier-v57-smoke.yml'

jobs:
  production-classifier-v57:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install -U numpy scikit-learn joblib
      - name: Validate constrained GAME meta calibration
        run: |
          python -m py_compile \
            tools/ml/evaluate_nevergone_constrained_game_meta_v57.py \
            tools/ml/nevergone_constrained_game_meta_v57_smoke.py
          PYTHONPATH=tools/ml python tools/ml/nevergone_constrained_game_meta_v57_smoke.py
          bash -n tools/ml/run_nevergone_constrained_game_meta_v57.sh
