name: Nevergone monotone correctness routing v8

on:
  pull_request:
    paths:
      - 'tools/ml/evaluate_nevergone_monotone_correctness_routing_v8.py'
      - 'tools/ml/nevergone_monotone_correctness_routing_v8_smoke.py'
      - 'tools/ml/run_nevergone_monotone_correctness_routing_v8.sh'
      - 'docs/ml/PRODUCTION_ROUTING_V8.md'
      - '.github/workflows/ml-production-routing-v8-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/evaluate_nevergone_monotone_correctness_routing_v8.py'
      - 'tools/ml/nevergone_monotone_correctness_routing_v8_smoke.py'
      - 'tools/ml/run_nevergone_monotone_correctness_routing_v8.sh'
      - 'docs/ml/PRODUCTION_ROUTING_V8.md'
      - '.github/workflows/ml-production-routing-v8-smoke.yml'

jobs:
  monotone-correctness-routing-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install -U numpy scikit-learn joblib
      - name: Validate v8 monotone correctness routing
        run: |
          python -m py_compile \
            tools/ml/evaluate_nevergone_monotone_correctness_routing_v8.py \
            tools/ml/nevergone_monotone_correctness_routing_v8_smoke.py
          PYTHONPATH=tools/ml python tools/ml/nevergone_monotone_correctness_routing_v8_smoke.py
          bash -n tools/ml/run_nevergone_monotone_correctness_routing_v8.sh
