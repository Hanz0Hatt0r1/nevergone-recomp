name: EnemyActions WBG fixed tail

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile fixed-tail WBG smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/hp_data_reader.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_prefix.cpp \
            tools/enemy_actions_wbg_fixed_tail_smoke.cpp \
            -o /tmp/enemy_actions_wbg_fixed_tail_smoke

      - name: Run fixed-tail WBG smoke
        run: /tmp/enemy_actions_wbg_fixed_tail_smoke
