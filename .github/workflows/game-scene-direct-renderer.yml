name: GameScene direct renderer

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_scene_direct_geometry.cpp'
      - 'android/app/src/main/cpp/game_scene_direct_geometry.h'
      - 'android/app/src/main/cpp/game_scene_direct_renderer.cpp'
      - 'android/app/src/main/cpp/game_scene_direct_renderer.h'
      - 'android/app/src/main/cpp/post_scene_overlay_jni.cpp'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/game_scene_direct_geometry_smoke.cpp'
      - '.github/workflows/game-scene-direct-renderer.yml'
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_scene_direct_geometry.cpp'
      - 'android/app/src/main/cpp/game_scene_direct_geometry.h'
      - 'android/app/src/main/cpp/game_scene_direct_renderer.cpp'
      - 'android/app/src/main/cpp/game_scene_direct_renderer.h'
      - 'android/app/src/main/cpp/post_scene_overlay_jni.cpp'
      - 'android/app/src/main/cpp/CMakeLists.txt'
      - 'tools/game_scene_direct_geometry_smoke.cpp'
      - '.github/workflows/game-scene-direct-renderer.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run direct geometry smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_scene_direct_geometry_smoke.cpp \
            android/app/src/main/cpp/game_scene_direct_geometry.cpp \
            -o /tmp/game_scene_direct_geometry_smoke
          /tmp/game_scene_direct_geometry_smoke
      - name: Syntax-check GLES renderer and frame hook
        run: |
          JAVA_HOME_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
            -I android/app/src/main/cpp \
            -I "$JAVA_HOME_PATH/include" \
            -I "$JAVA_HOME_PATH/include/linux" \
            android/app/src/main/cpp/game_scene_direct_renderer.cpp \
            android/app/src/main/cpp/post_scene_overlay_jni.cpp
