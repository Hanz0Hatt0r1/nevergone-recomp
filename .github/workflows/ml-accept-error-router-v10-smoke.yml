name: Nevergone accept-error router v10

on:
  pull_request:
    paths:
      - 'tools/ml/train_nevergone_accept_error_router_v10.py'
      - 'tools/ml/classify_nevergone_pcode_with_accept_router.py'
      - 'tools/ml/nevergone_accept_error_router_v10_smoke.py'
      - 'tools/ml/run_nevergone_accept_error_router_v10.sh'
      - 'docs/ml/ACCEPT_ERROR_ROUTER_V10.md'
      - '.github/workflows/ml-accept-error-router-v10-smoke.yml'
  workflow_dispatch:

jobs:
  accept-error-router-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Hanz0Hatt0r1/revenginstr
          ref: 0d05223391729fcb2dec2d7187a371d0ba84d690
          path: revenginstr
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned shared tooling and ML dependencies
        run: python -m pip install -U numpy scikit-learn joblib
      - name: Install revenginstr
        run: |
          test "$(git -C revenginstr rev-parse HEAD)" = '0d05223391729fcb2dec2d7187a371d0ba84d690'
          python -m pip install -e 'revenginstr[ml]'
      - name: Validate v10 accept-error router packaging
        run: |
          python -m py_compile \
            tools/ml/train_nevergone_accept_error_router_v10.py \
            tools/ml/classify_nevergone_pcode_with_accept_router.py \
            tools/ml/nevergone_accept_error_router_v10_smoke.py
          python tools/ml/nevergone_accept_error_router_v10_smoke.py
