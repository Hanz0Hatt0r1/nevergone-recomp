name: TrapActions primary block

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run TrapActions primary smoke
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/hp_data_reader.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_prefix.cpp \
            android/app/src/main/cpp/trap_actions_prefix.cpp \
            android/app/src/main/cpp/trap_actions_primary.cpp \
            tools/trap_actions_primary_smoke.cpp \
            -o /tmp/trap_actions_primary_smoke
          /tmp/trap_actions_primary_smoke
