name: Android native link

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/**'
      - 'android/app/src/main/java/**'
      - 'android/app/build.gradle'
      - '.github/workflows/android-native-link.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/**'
      - 'android/app/src/main/java/**'
      - 'android/app/build.gradle'
      - '.github/workflows/android-native-link.yml'

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.22.1' \
            'ndk;28.2.13676358'
      - name: Prepare verified Lua
        run: python3 tools/fetch_lua_5_2_3.py
      - name: Assemble ARM debug APK
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nevergone-arm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
