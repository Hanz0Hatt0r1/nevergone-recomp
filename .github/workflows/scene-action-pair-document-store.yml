name: SceneActions pair document store

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/scene_action_pair_document_store.*'
      - 'android/app/src/main/cpp/trap_actions_*.cpp'
      - 'android/app/src/main/cpp/trap_actions_*.h'
      - 'android/app/src/main/cpp/enemy_actions_wbg_*.cpp'
      - 'android/app/src/main/cpp/enemy_actions_wbg_*.h'
      - 'android/app/src/main/cpp/hp_data_reader.*'
      - 'tools/scene_action_pair_document_store_smoke.cpp'
      - '.github/workflows/scene-action-pair-document-store.yml'
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SceneActions pair document store smoke
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            android/app/src/main/cpp/hp_data_reader.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_prefix.cpp \
            android/app/src/main/cpp/enemy_actions_wbg_final_table.cpp \
            android/app/src/main/cpp/trap_actions_prefix.cpp \
            android/app/src/main/cpp/trap_actions_primary.cpp \
            android/app/src/main/cpp/trap_actions_compact.cpp \
            android/app/src/main/cpp/trap_actions_core_document.cpp \
            android/app/src/main/cpp/trap_actions_combo_section.cpp \
            android/app/src/main/cpp/trap_actions_document.cpp \
            android/app/src/main/cpp/scene_action_pair_document_store.cpp \
            tools/scene_action_pair_document_store_smoke.cpp \
            -o /tmp/scene_action_pair_document_store_smoke
          /tmp/scene_action_pair_document_store_smoke
