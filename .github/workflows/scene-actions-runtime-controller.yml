name: SceneActions runtime controller

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/scene_actions_runtime_controller.h'
      - 'android/app/src/main/cpp/scene_actions_active_playback.h'
      - 'android/app/src/main/cpp/scene_action_trigger_runtime.h'
      - 'tools/scene_actions_runtime_controller_smoke.cpp'
      - '.github/workflows/scene-actions-runtime-controller.yml'
  push:
    paths:
      - 'android/app/src/main/cpp/scene_actions_runtime_controller.h'
      - 'android/app/src/main/cpp/scene_actions_active_playback.h'
      - 'android/app/src/main/cpp/scene_action_trigger_runtime.h'
      - 'tools/scene_actions_runtime_controller_smoke.cpp'
      - '.github/workflows/scene-actions-runtime-controller.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SceneActions runtime-controller smoke
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iandroid/app/src/main/cpp \
            tools/scene_actions_runtime_controller_smoke.cpp \
            -o /tmp/scene_actions_runtime_controller_smoke
          /tmp/scene_actions_runtime_controller_smoke
