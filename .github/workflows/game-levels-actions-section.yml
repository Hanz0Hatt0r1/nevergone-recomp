name: GameLevels actions section

on:
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/game_levels_actions_section.cpp'
      - 'android/app/src/main/cpp/game_levels_actions_section.h'
      - 'android/app/src/main/cpp/hp_data_reader.cpp'
      - 'android/app/src/main/cpp/hp_data_reader.h'
      - 'tools/game_levels_actions_section_smoke.cpp'
      - '.github/workflows/game-levels-actions-section.yml'
  pull_request:
    paths:
      - 'android/app/src/main/cpp/game_levels_actions_section.cpp'
      - 'android/app/src/main/cpp/game_levels_actions_section.h'
      - 'android/app/src/main/cpp/hp_data_reader.cpp'
      - 'android/app/src/main/cpp/hp_data_reader.h'
      - 'tools/game_levels_actions_section_smoke.cpp'
      - '.github/workflows/game-levels-actions-section.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run actions-section smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I android/app/src/main/cpp \
            tools/game_levels_actions_section_smoke.cpp \
            android/app/src/main/cpp/game_levels_actions_section.cpp \
            android/app/src/main/cpp/hp_data_reader.cpp \
            -o /tmp/game_levels_actions_section_smoke
          /tmp/game_levels_actions_section_smoke
