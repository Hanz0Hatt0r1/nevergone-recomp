name: CharacterName assets

on:
  pull_request:
    paths:
      - 'android/app/src/main/cpp/character_name_assets.cpp'
      - 'android/app/src/main/cpp/character_name_assets.h'
      - 'tools/character_name_assets_smoke.cpp'
      - '.github/workflows/character-name-assets.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/cpp/character_name_assets.cpp'
      - 'android/app/src/main/cpp/character_name_assets.h'
      - 'tools/character_name_assets_smoke.cpp'
      - '.github/workflows/character-name-assets.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run CharacterName asset smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            tools/character_name_assets_smoke.cpp \
            android/app/src/main/cpp/character_name_assets.cpp \
            -o /tmp/character_name_assets_smoke
          /tmp/character_name_assets_smoke
