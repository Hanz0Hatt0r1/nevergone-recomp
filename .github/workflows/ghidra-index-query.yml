name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Trace ChooseHeroReadyUIScene level map
        run: |
          echo '=== initLevelMap ==='
          python tools/ghidra/query_full_index.py callers 002f13a8 --limit 50 || true
          python tools/ghidra/query_full_index.py callees 002f13a8 --limit 100 || true
          echo '=== loadGameSceneData ==='
          python tools/ghidra/query_full_index.py callers 002f0efc --limit 100 || true
          python tools/ghidra/query_full_index.py callees 002f0efc --limit 250 || true
          echo '=== related strings ==='
          python - <<'PY'
          import base64,csv,gzip
          from pathlib import Path
          root=Path('docs/ghidra/full-index')
          def rows(n):
              with gzip.open(root/n,'rt',encoding='utf-8',newline='') as f: yield from csv.DictReader(f,delimiter='\t')
          def hx(v):
              try:return int(v,16)
              except:return None
          entries=sorted(e for r in rows('libcocos2dcpp.functions.tsv.gz') if (e:=hx(r.get('entry',''))) is not None)
          strings={}
          for r in rows('libcocos2dcpp.strings.tsv.gz'):
              a=hx(r.get('address',''))
              if a is None: continue
              try: strings[a]=base64.b64decode(r['utf8_base64']).decode('utf-8','replace')
              except: pass
          xrefs=list(rows('libcocos2dcpp.xrefs.tsv.gz'))
          for start,name in [(0x002f13a8,'initLevelMap'),(0x002f0efc,'loadGameSceneData')]:
              end=min((e for e in entries if e>start),default=start+0x3000)
              print(f'--- {name} [{start:08x},{end:08x}) ---')
              for xr in xrefs:
                  frm=hx(xr.get('from','')); to=hx(xr.get('to',''))
                  if frm is not None and start<=frm<end and to in strings:
                      print(f'{frm:08x} -> {to:08x} [{xr.get("type","")}] {strings[to]}')
          PY
