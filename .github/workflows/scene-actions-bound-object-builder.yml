name: SceneActions bound object builder

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SceneActions bound-object smoke
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iandroid/app/src/main/cpp
          tools/scene_actions_bound_object_builder_smoke.cpp
          -o /tmp/scene_actions_bound_object_builder_smoke
      - name: Run SceneActions bound-object smoke
        run: /tmp/scene_actions_bound_object_builder_smoke
