name: Ghidra index query smoke

on:
  pull_request:
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ghidra/query_full_index.py'
      - 'tools/ghidra/test_query_full_index.py'
      - '.github/workflows/ghidra-index-query.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile query tool
        run: python -m py_compile tools/ghidra/query_full_index.py tools/ghidra/test_query_full_index.py
      - name: Run query smoke test
        run: python tools/ghidra/test_query_full_index.py
      - name: Query ChooseHero background frame metadata
        run: |
          python - <<'PY'
          import base64, csv, gzip
          from pathlib import Path
          root=Path('docs/ghidra/full-index')
          def rows(name):
              with gzip.open(root/name,'rt',encoding='utf-8',newline='') as f:
                  yield from csv.DictReader(f,delimiter='\t')
          def hx(v):
              try:return int(v,16)
              except:return None
          funcs=[]; names={}
          for r in rows('libcocos2dcpp.functions.tsv.gz'):
              e=hx(r.get('entry',''))
              if e is not None: funcs.append(e); names[e]=r.get('name','')
          funcs.sort()
          strings={}
          for r in rows('libcocos2dcpp.strings.tsv.gz'):
              a=hx(r.get('address',''))
              if a is None: continue
              try: strings[a]=base64.b64decode(r['utf8_base64']).decode('utf-8','replace')
              except: pass
          wanted={
              'ChooseHeroBackground::BalckCloud','ChooseHeroBackground::PartOne',
              'ChooseHeroBackground::PartTow','ChooseHeroBackground::PartThree',
              'ChooseHeroBackground::CreateSun','ChooseHeroBackground::CreateStar',
              'ChooseHeroBackground::CreateMeteor','ChooseHeroBackground::CreateEagle',
              'ChooseHero::initBG','ChooseHero::initSaveDataUI'}
          xrefs=list(rows('libcocos2dcpp.xrefs.tsv.gz')); calls=list(rows('libcocos2dcpp.calls.tsv.gz'))
          for start in sorted(e for e,n in names.items() if n in wanted):
              end=min((e for e in funcs if e>start),default=start+0x3000)
              print(f'--- {start:08x} {names[start]} [{end:08x}) ---')
              for xr in xrefs:
                  frm=hx(xr.get('from','')); to=hx(xr.get('to',''))
                  if frm is not None and start<=frm<end and to in strings:
                      print(f'STR\t{frm:08x}\t{strings[to]}')
              for c in calls:
                  ce=hx(c.get('caller_entry','')); site=hx(c.get('call_site','')); callee=hx(c.get('callee_entry',''))
                  if ce==start and site is not None:
                      print(f'CALL\t{site:08x}\t{callee:08x}\t{names.get(callee,"<unknown>")}')
          PY
          echo '=== archive entries around Gate_Background ==='
          python tools/ghidra/query_full_index.py archives 'Gate_Background' --limit 200 || true
          echo '=== atlas frame searches ==='
          python tools/ghidra/query_full_index.py atlases 'wj' --limit 200 || true
          python tools/ghidra/query_full_index.py atlases 'beijing' --limit 200 || true
          python tools/ghidra/query_full_index.py atlases 'background' --limit 200 || true
