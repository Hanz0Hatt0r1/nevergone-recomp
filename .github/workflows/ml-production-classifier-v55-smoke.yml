name: Nevergone Production Classifier v5.5 Pareto verifier

on:
  pull_request:
    paths:
      - 'tools/ml/evaluate_nevergone_pareto_game_verifier_v55.py'
      - 'tools/ml/nevergone_pareto_game_verifier_v55_smoke.py'
      - 'tools/ml/run_nevergone_pareto_game_verifier_v55.sh'
      - 'docs/ml/PRODUCTION_CLASSIFIER_V55.md'
      - '.github/workflows/ml-production-classifier-v55-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/ml/evaluate_nevergone_pareto_game_verifier_v55.py'
      - 'tools/ml/nevergone_pareto_game_verifier_v55_smoke.py'
      - 'tools/ml/run_nevergone_pareto_game_verifier_v55.sh'
      - 'docs/ml/PRODUCTION_CLASSIFIER_V55.md'
      - '.github/workflows/ml-production-classifier-v55-smoke.yml'

jobs:
  production-classifier-v55:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependencies
        run: python -m pip install -U numpy scikit-learn joblib
      - name: Validate Pareto game verifier
        run: |
          python -m py_compile \
            tools/ml/evaluate_nevergone_pareto_game_verifier_v55.py \
            tools/ml/nevergone_pareto_game_verifier_v55_smoke.py
          PYTHONPATH=tools/ml python tools/ml/nevergone_pareto_game_verifier_v55_smoke.py
          bash -n tools/ml/run_nevergone_pareto_game_verifier_v55.sh
