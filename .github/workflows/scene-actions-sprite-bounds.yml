name: SceneActions sprite bounds

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SceneActions sprite-bounds smoke
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iandroid/app/src/main/cpp
          tools/scene_actions_sprite_bounds_smoke.cpp
          android/app/src/main/cpp/game_scene_direct_geometry.cpp
          -o /tmp/scene_actions_sprite_bounds_smoke
      - name: Run SceneActions sprite-bounds smoke
        run: /tmp/scene_actions_sprite_bounds_smoke
