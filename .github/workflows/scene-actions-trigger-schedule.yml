name: SceneActions trigger schedule

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SceneActions trigger schedule smoke
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iandroid/app/src/main/cpp
          tools/scene_actions_trigger_schedule_smoke.cpp
          -o /tmp/scene_actions_trigger_schedule_smoke
      - name: Run SceneActions trigger schedule smoke
        run: /tmp/scene_actions_trigger_schedule_smoke
